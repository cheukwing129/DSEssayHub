<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文體分類 | DSE 中文科範文自學平台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.genre-hero{padding:calc(var(--header-height) + 40px) 0 32px;}
.genre-hero h1{font-size:2rem;margin-bottom:8px;}
.genre-hero p{color:var(--color-ink-soft);}
.structure-diagram{display:flex;flex-wrap:wrap;gap:10px;margin:24px 0 40px;}
.structure-step{flex:1;min-width:140px;background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-md);padding:14px 16px;position:relative;}
.structure-step h4{font-size:0.95rem;margin-bottom:4px;color:var(--color-primary);}
.structure-step p{font-size:0.8rem;color:var(--color-ink-soft);}
.structure-arrow{display:flex;align-items:center;color:var(--color-ink-faint);font-size:1.2rem;}
.filter-bar{display:flex;align-items:center;gap:12px;margin-bottom:24px;flex-wrap:wrap;}
.filter-bar label{font-size:0.9rem;color:var(--color-ink-soft);}
.filter-bar select{padding:8px 14px;border-radius:999px;border:1px solid var(--color-border);background:var(--color-surface);font-family:inherit;font-size:0.9rem;}
@media (max-width:720px){.structure-diagram{flex-direction:column;}.structure-arrow{transform:rotate(90deg);justify-content:center;}}
</style>
</head>
<body>
<header class="site-header">
<div class="container nav-inner">
<a href="index.html" class="logo"><span class="logo-mark">範文自學</span><span class="logo-sub">DSE 中文寫作</span></a>
<button class="nav-toggle" id="navToggle" type="button" aria-label="開關選單" aria-expanded="false" aria-controls="mainNav">
<span></span><span></span><span></span>
</button>
<div class="main-nav" id="mainNav">
<nav class="nav-links" aria-label="主導航">
<a href="index.html#genres">文體分類</a>
<a href="questions.html">歷屆試題</a>
<a href="techniques.html">寫作技巧</a>
<a href="notes.html">我的筆記</a>
</nav>
<form class="nav-search" role="search" onsubmit="return false">
<svg class="search-icon" viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle cx="8.5" cy="8.5" r="6" stroke="currentColor" stroke-width="1.6"/><line x1="13.1" y1="13.1" x2="18" y2="18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
<input type="search" name="q" placeholder="搜尋篇章、題目、關鍵字…" aria-label="搜尋">
</form>
</div>
</div>
</header>

<main>
<section class="genre-hero container">
<h1 id="genreTitle">文體分類</h1>
<p id="genreDesc">載入中…</p>
</section>

<section class="container">
<div class="structure-diagram" id="structureDiagram"></div>

<div class="filter-bar">
<label for="themeFilter">依立意向度篩選：</label>
<select id="themeFilter">
<option value="">全部</option>
</select>
</div>

<div class="article-grid" id="articleGrid"></div>
<p class="status-text" id="articleStatus">正在載入範文資料…</p>
</section>
</main>

<footer class="site-footer">
<div class="container footer-inner"><p>DSE 中文科範文自學平台</p></div>
</footer>

<script src="main.js"></script>
<script>
(function () {
  const GENRE_LABELS = {
    narrative: '記敘抒情文', argumentative: '論說文',
    descriptive: '描寫文', topic: '話題式/開放式'
  };
  const GENRE_DESC = {
    narrative: '以事件為骨架，抒情為血肉。掌握起承轉合的結構，寫出真摯動人的成長體會。',
    argumentative: '層層遞進的論證脈絡，從個人角度到社會、哲理，展現思辨深度。',
    descriptive: '細膩捕捉人物與景物的神韻，運用多重感官與對比襯托手法。',
    topic: '圖畫寓意題與限定格式題，考驗取材角度與扣題能力。'
  };
  const STRUCTURES = {
    narrative: [
      ['起', '景物/伏筆，鋪排「我」出現，交代背景'],
      ['承', '「原本」的性格/行為，細寫關鍵情節，突顯覺醒前的心境'],
      ['轉', '關鍵人物/事件觸發覺醒，性格或心境開始轉變'],
      ['合', '解釋主題字詞，抒發人生道理，回應開首、總結心情']
    ],
    argumentative: [
      ['引入', '提出爭論或中心論點'],
      ['定義', '解釋題目關鍵字詞'],
      ['角度一', '個人/淺層角度分析'],
      ['角度二', '社會/深層角度分析'],
      ['角度三', '哲理/文化角度分析'],
      ['駁論', '反駁相反觀點'],
      ['總結', '呼應論點，總結全文']
    ],
    descriptive: [
      ['外觀', '描寫人物或景物的外貌特徵'],
      ['動靜', '動態與靜態描寫交錯運用'],
      ['對比', '透過對比突顯描寫對象特點'],
      ['側寫', '借周邊人物或環境間接呈現主體']
    ],
    topic: [
      ['審圖/審題', '解讀圖畫寓意或限定格式要求'],
      ['取材', '從個人或社會角度選取合適材料'],
      ['立意', '扣連寓意，抉發深刻道理'],
      ['扣題', '全文緊扣題目指定格式或寓意收結']
    ]
  };

  const params = new URLSearchParams(window.location.search);
  const genreType = params.get('type') || 'narrative';

  document.getElementById('genreTitle').textContent = GENRE_LABELS[genreType] || '文體分類';
  document.getElementById('genreDesc').textContent = GENRE_DESC[genreType] || '';

  const diagramEl = document.getElementById('structureDiagram');
  const steps = STRUCTURES[genreType] || [];
  diagramEl.innerHTML = steps.map((step, i) => {
    const stepHtml = `<div class="structure-step"><h4>${step[0]}</h4><p>${step[1]}</p></div>`;
    const arrowHtml = i < steps.length - 1 ? '<div class="structure-arrow">→</div>' : '';
    return stepHtml + arrowHtml;
  }).join('');

  const articleGrid = document.getElementById('articleGrid');
  const articleStatus = document.getElementById('articleStatus');
  const themeFilter = document.getElementById('themeFilter');
  let allArticlesOfGenre = [];
  let themeNameById = {};
  let questionFullByKey = {};

  function escapeHtml(str) {
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function formatRelatedQuestions(relatedQuestions) {
    if (!relatedQuestions || relatedQuestions.length === 0) return '年份／題號待補';
    return relatedQuestions.map(q => `${q.year}年 ${q.questionNumber}`).join('・');
  }

  function getQuestionFullText(relatedQuestions) {
    if (!relatedQuestions || relatedQuestions.length === 0) return '（題目待補）';
    const first = relatedQuestions[0];
    const key = `${first.year}_${first.questionNumber}`;
    return questionFullByKey[key] || '（題目待補）';
  }

  function buildThemeTagsHtml(themeConceptIds) {
    if (!themeConceptIds || themeConceptIds.length === 0) return '';
    return themeConceptIds.map(id => {
      const name = themeNameById[id] || id;
      return `<span class="tag">${escapeHtml(name)}</span>`;
    }).join('');
  }

  function buildCardHtml(article) {
    const genreLabel = GENRE_LABELS[article.genre] || article.genre;
    const yearQuestionText = formatRelatedQuestions(article.relatedQuestions);
    const questionText = getQuestionFullText(article.relatedQuestions);
    const themeTagsHtml = buildThemeTagsHtml(article.themeConceptIds);
    const paddedId = String(article.id).padStart(2, '0');
    return `<a class="article-card" href="article.html?id=${article.id}">
      <div class="article-card-head">
        <span class="article-id">篇章 ${paddedId}</span>
        <span class="article-genre-tag">${escapeHtml(genreLabel)}</span>
      </div>
      <p class="article-meta">${escapeHtml(yearQuestionText)}</p>
      <p class="article-question">${escapeHtml(questionText)}</p>
      <div class="article-tags">${themeTagsHtml}</div>
    </a>`;
  }

  function renderArticles(list) {
    if (list.length === 0) {
      articleGrid.innerHTML = '';
      articleStatus.textContent = '此文體目前尚未有符合條件的範文。';
      articleStatus.style.display = '';
      return;
    }
    articleStatus.style.display = 'none';
    articleGrid.innerHTML = list.map(buildCardHtml).join('');
  }

  themeFilter.addEventListener('change', () => {
    const selected = themeFilter.value;
    const filtered = selected
      ? allArticlesOfGenre.filter(a => (a.themeConceptIds || []).includes(selected))
      : allArticlesOfGenre;
    renderArticles(filtered);
  });

  async function loadGenrePage() {
    try {
      const [articlesRes, themesRes, questionsRes] = await Promise.all([
        fetch('data/articles.json'),
        fetch('data/themes.json'),
        fetch('data/questions.json')
      ]);
      if (!articlesRes.ok || !themesRes.ok || !questionsRes.ok) {
        throw new Error('資料檔案讀取失敗');
      }
      const articles = await articlesRes.json();
      const themes = await themesRes.json();
      const questions = await questionsRes.json();

      themes.forEach(t => { themeNameById[t.id] = t.name; });
      questions.forEach(q => {
        questionFullByKey[`${q.year}_${q.questionNumber}`] = q.questionFull;
      });

      allArticlesOfGenre = articles.filter(a => a.genre === genreType)
        .sort((a, b) => a.id - b.id);

      const usedThemeIds = new Set();
      allArticlesOfGenre.forEach(a => (a.themeConceptIds || []).forEach(id => usedThemeIds.add(id)));
      themeFilter.innerHTML = '<option value="">全部</option>' +
        Array.from(usedThemeIds).map(id =>
          `<option value="${id}">${escapeHtml(themeNameById[id] || id)}</option>`
        ).join('');

      renderArticles(allArticlesOfGenre);
    } catch (error) {
      console.error('讀取範文資料時發生錯誤：', error);
      articleStatus.textContent = '範文資料載入失敗，請確認網站是透過伺服器（而非直接開啟檔案）瀏覽。';
    }
  }

  loadGenrePage();
})();
</script>
</body>
</html>
