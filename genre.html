<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文體分類 | DSE 中文科範文自學平台</title>
<link rel="stylesheet" href="style.css">
<style>
.genre-page{padding:calc(var(--header-height) + 48px) 0 64px}.genre-head{margin-bottom:28px}.genre-head h1{font-size:2rem;margin-bottom:8px}.genre-head p{color:var(--color-ink-soft)}.structure{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 34px}.step{flex:1;min-width:145px;background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-md);padding:14px}.step b{color:var(--color-primary)}.step small{display:block;color:var(--color-ink-soft);margin-top:4px}.arrow{align-self:center;color:var(--color-ink-faint)}.filter{display:flex;gap:10px;align-items:center;margin-bottom:20px}.filter select{padding:8px 12px;border:1px solid var(--color-border);border-radius:999px;background:white;font-family:inherit}.article-card{display:flex!important;flex-direction:column!important;gap:10px!important}.article-card-link{margin-top:auto;color:var(--color-primary);font-size:.85rem}.status{color:var(--color-ink-soft);padding:20px 0}@media(max-width:720px){.structure{flex-direction:column}.arrow{transform:rotate(90deg);text-align:center}.genre-page{padding-top:calc(var(--header-height) + 30px)}}
</style>
</head>
<body>
<header class="site-header"><div class="container nav-inner"><a href="index.html" class="logo"><span class="logo-mark">範文自學</span><span class="logo-sub">DSE 中文寫作</span></a><button class="nav-toggle" id="navToggle" aria-expanded="false" aria-controls="mainNav"><span></span><span></span><span></span></button><div class="main-nav" id="mainNav"><nav class="nav-links"><a href="index.html#genres">文體分類</a><a href="questions.html">歷屆試題</a><a href="techniques.html">寫作技巧</a><a href="notes.html">我的筆記</a></nav><form class="nav-search" onsubmit="return false"><input type="search" placeholder="搜尋關鍵字" aria-label="搜尋"></form></div></div></header>
<main class="genre-page"><div class="container"><div class="genre-head"><h1 id="title">文體分類</h1><p id="desc">資料載入中……</p></div><div class="structure" id="structure"></div><div class="filter"><label for="theme">依立意向度：</label><select id="theme"><option value="">全部文章</option></select></div><div class="article-grid" id="grid"></div><p class="status" id="status">正在載入範文……</p></div></main><footer class="site-footer"><div class="container footer-inner"><p>DSE 中文科範文自學平台</p></div></footer>
<script>
const labels={narrative:'記敘抒情文',argumentative:'論說文',descriptive:'描寫文',topic:'話題式/開放式'};const desc={narrative:'以事件為骨架、抒情為血肉，掌握起承轉合。',argumentative:'由個人到社會、哲理，層層推進論證。',descriptive:'細膩描寫人物與景物，營造鮮明畫面。',topic:'掌握圖畫寓意或限定格式，發展取材角度。'};const flow={narrative:[['起','景物/伏筆'],['承','衝突與覺醒前'],['轉','關鍵人物/覺醒'],['合','立意與人生道理']],argumentative:[['引入','中心論點'],['定義','解釋關鍵詞'],['角度一','個人層面'],['角度二','社會層面'],['駁論','回應反方'],['總結','呼應論點']],descriptive:[['外觀','人物/景物'],['動靜','動態與靜態'],['對比','突顯特點'],['側寫','間接呈現']],topic:[['審題','解讀要求'],['取材','選取材料'],['立意','扣連寓意'],['扣題','完整收結']]};
const type=new URLSearchParams(location.search).get('type')||'narrative';document.getElementById('title').textContent=labels[type]||'文體分類';document.getElementById('desc').textContent=desc[type]||'';document.getElementById('structure').innerHTML=(flow[type]||[]).map((x,i)=>`<div class="step"><b>${x[0]}</b><small>${x[1]}</small></div>${i<flow[type].length-1?'<span class="arrow">→</span>':''}`).join('');
const grid=document.getElementById('grid'),status=document.getElementById('status'),filter=document.getElementById('theme');let articles=[],themes={},questions={};const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');function render(list){grid.innerHTML=list.map(a=>{const q=(a.relatedQuestions||[])[0];const title=q?questions[q.year+'_'+q.questionNumber]:'題目待補';return `<a class="article-card" href="article.html?id=${a.id}"><div class="article-card-head"><span class="article-id">篇章 ${String(a.id).padStart(2,'0')}</span><span class="article-genre-tag">${labels[a.genre]||a.genre}</span></div><p class="article-meta">${q?esc(q.year+'年 '+q.questionNumber):'年份／題號待補'}</p><p class="article-question">${esc(title)}</p><div class="article-tags">${(a.themeConceptIds||[]).map(id=>`<span class="tag">${esc(themes[id]||id)}</span>`).join('')}</div><span class="article-card-link">閱讀範文 →</span></a>`}).join('');status.style.display=list.length?'none':'';if(!list.length)status.textContent='此文體目前尚未有範文。'};
(async()=>{try{const [ar,tr,qr]=await Promise.all([fetch('data/articles.json'),fetch('data/themes.json'),fetch('data/questions.json')]);if(!ar.ok||!tr.ok||!qr.ok)throw Error('資料讀取失敗');articles=(await ar.json()).filter(a=>a.genre===type);(await tr.json()).forEach(t=>themes[t.id]=t.name);(await qr.json()).forEach(q=>questions[q.year+'_'+q.questionNumber]=q.questionFull);const ids=[...new Set(articles.flatMap(a=>a.themeConceptIds||[]))];filter.innerHTML='<option value="">全部文章</option>'+ids.map(id=>`<option value="${id}">${esc(themes[id]||id)}</option>`).join('');render(articles)}catch(e){console.error(e);status.textContent='資料載入失敗，請確認 data 資料夾及網站伺服器設定。'}})();filter.addEventListener('change',()=>render(filter.value?articles.filter(a=>(a.themeConceptIds||[]).includes(filter.value)):articles));
</script>
</body>
</html>
