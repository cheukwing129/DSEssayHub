<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>按文體瀏覽｜DSE 中文科範文</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="container nav-inner">
      <a href="index.html" class="logo"><span class="logo-mark">文</span><span class="logo-sub">DSE 中文科</span></a>
      <button class="nav-toggle" id="navToggle" type="button" aria-label="開啟選單" aria-expanded="false" aria-controls="mainNav"><span></span><span></span><span></span></button>
      <div class="main-nav" id="mainNav"><nav class="nav-links" aria-label="主要導覽"><a href="genre.html">範文分類</a><a href="questions.html">歷屆試題</a><a href="techniques.html">寫作手法</a><a href="notes.html">我的筆記</a></nav></div>
    </div>
  </header>
  <main class="genre-page"><div class="container">
    <p class="eyebrow">ARTICLE LIBRARY</p>
    <h1 id="pageTitle">範文分類</h1>
    <p class="page-lead">收錄 2012 至 2026 年 DSE 中文科寫作卷範文，可按年份或題型篩選，並直接連結到對應的範文拆解。</p>
    <div class="filter-bar">
      <label>年份：<select id="yearFilter"><option value="">全部年份</option></select></label>
      <label>題型：<select id="genreFilter"><option value="">全部題型</option><option value="narrative">記敘抒情文</option><option value="argumentative">論說文</option><option value="descriptive">描寫文</option><option value="topic">話題式／開放式</option><option value="practical">實用寫作</option></select></label>
    </div>
    <p id="status" class="status">範文載入中…</p>
    <section id="articleList" class="article-list" aria-live="polite"></section>
  </div></main>
  <footer class="site-footer"><div class="container footer-inner"><p>DSE 中文科範文自學平台</p></div></footer>
  <script>
    const navToggle=document.getElementById('navToggle');const mainNav=document.getElementById('mainNav');
    if(navToggle&&mainNav)navToggle.addEventListener('click',()=>{const open=navToggle.getAttribute('aria-expanded')==='true';navToggle.setAttribute('aria-expanded',String(!open));mainNav.classList.toggle('is-open',!open)});
    const labels={narrative:'記敘抒情文',argumentative:'論說文',descriptive:'描寫文',topic:'話題式／開放式',practical:'實用寫作'};let articles=[];
    const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
    function getYearNumber(year){const m=String(year??'').match(/(\d{4})/);return m?Number(m[1]):-Infinity}
    function getQuestionNumber(number){const m=String(number??'').match(/(\d+)/);return m?Number(m[1]):999}
    function sortByYearAndQuestion(a,b){const qa=a.relatedQuestions?.[0]||{};const qb=b.relatedQuestions?.[0]||{};const yd=getYearNumber(qb.year)-getYearNumber(qa.year);if(yd)return yd;const qd=getQuestionNumber(qa.questionNumber)-getQuestionNumber(qb.questionNumber);return qd||Number(a.id||0)-Number(b.id||0)}
    async function load(){try{const r=await fetch('data/articles.json',{cache:'no-store'});if(!r.ok)throw Error();articles=await r.json();const years=[...new Set(articles.flatMap(a=>(a.relatedQuestions||[]).map(q=>q.year)))].sort((a,b)=>getYearNumber(b)-getYearNumber(a));document.getElementById('yearFilter').innerHTML+='<option>'+years.map(esc).join('</option><option>')+'</option>';const params=new URLSearchParams(location.search);document.getElementById('genreFilter').value=params.get('type')||'';render()}catch(e){document.getElementById('status').textContent='資料載入失敗，請確認 data/articles.json 是否存在。'}}
    function render(){const y=document.getElementById('yearFilter').value,g=document.getElementById('genreFilter').value;const list=articles.filter(a=>(!g||a.genre===g)&&(!y||(a.relatedQuestions||[]).some(q=>String(q.year)===y))).sort(sortByYearAndQuestion);document.getElementById('status').textContent=`共 ${list.length} 篇範文`;document.getElementById('articleList').innerHTML=list.map(a=>{const q=a.relatedQuestions?.[0]||{};return `<article class="article-list-item"><div><p class="article-meta-line">${esc(q.year)}年 ${esc(q.questionNumber)} ・ ${esc(labels[a.genre]||a.genre)}</p><h2>篇章 ${String(a.id).padStart(2,'0')}</h2><p>${esc(a.summary||'')}</p></div><a class="btn btn-small" href="article.html?id=${encodeURIComponent(a.id)}">查看範文 →</a></article>`}).join('')||'<p>沒有符合條件的範文。</p>'}
    document.getElementById('yearFilter').addEventListener('change',render);document.getElementById('genreFilter').addEventListener('change',render);load();
  </script>
</body>
</html>
