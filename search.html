<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>搜尋結果｜DSE 中文科範文自學平台</title>
  <meta name="description" content="搜尋 DSE 中文科範文、歷屆試題、立意向度及常用寫作手法。">
  <link rel="stylesheet" href="style.css">
  <style>
    .search-page { padding: calc(var(--header-height, 72px) + 48px) 0 64px; }

    .search-head { margin-bottom: 8px; }
    .search-head h1 { font-size: 1.7rem; margin-bottom: 6px; word-break: break-word; }
    .search-hint { color: var(--color-ink-soft, #5c6b5f); font-size: .92rem; }

    .search-summary { font-size: .85rem; color: var(--color-ink-faint, #8b988e); margin: 14px 0 12px; }
    .search-jump-links { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 28px; }
    .search-jump-links[hidden] { display: none; }
    .search-jump-link { display: inline-flex; align-items: center; min-height: 44px; padding: 8px 14px; border: 1px solid var(--color-border, #ddd6c4); border-radius: 999px; background: var(--color-surface, #fff); color: var(--color-primary, #1f3a5f); font-size: .82rem; text-decoration: none; }
    .search-jump-link:hover,.search-jump-link:focus-visible { border-color: var(--color-primary, #1f3a5f); background: var(--color-primary-soft, #e7edf3); }

    .result-section { margin-bottom: 40px; scroll-margin-top: calc(var(--header-height, 72px) + 20px); }
    .result-section h2 { font-size: 1.1rem; margin-bottom: 14px; color: var(--color-ink, #23322b); }

    /* 範文結果卡片：跟 genre.html 的範文卡片共用同一套外觀 */
    .article-card { display: flex !important; flex-direction: column !important; gap: 10px !important; }
    .article-summary { color: var(--color-ink-soft, #5c6b5f); font-size: .9rem; line-height: 1.7; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .article-match-label { display: inline-block; margin-right: 7px; color: var(--color-primary, #1f3a5f); font-size: .75rem; font-weight: 700; }
    .article-card-link { margin-top: auto; color: var(--color-primary, #1f3a5f); font-size: .85rem; }

    /* 試題結果卡片：跟 questions.html 的試題卡片共用同一套外觀 */
    .question-list { display: flex; flex-direction: column; gap: 14px; }
    .question-card { display: flex; flex-direction: column; gap: 10px; background: var(--color-surface, #fff); border: 1px solid var(--color-border, #ddd6c4); border-radius: var(--radius-md, 10px); padding: 20px 22px; }
    .question-card-head { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; }
    .question-year { font-family: var(--font-serif, serif); font-weight: 700; color: var(--color-primary, #1f3a5f); font-size: .95rem; }
    .question-number { color: var(--color-ink, #23322b); font-weight: 700; }
    .question-type-tag { font-size: .72rem; color: var(--color-ink-soft, #5c6b5f); background: var(--color-bg-alt, #eef0e8); padding: 3px 10px; border-radius: 999px; }
    .question-full { font-size: 1rem; color: var(--color-ink, #23322b); line-height: 1.85; }
    .question-links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
    .question-links a { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; font-size: .82rem; color: var(--color-primary, #1f3a5f); background: var(--color-primary-soft, #e7edf3); padding: 8px 14px; border-radius: 999px; }
    .question-links a:hover { opacity: .85; }
    .no-article { font-size: .82rem; color: var(--color-ink-faint, #8b988e); }

    /* 寫作技巧結果卡片：跟 techniques.html 的卡片共用同一套外觀 */
    .technique-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
    .technique-card { background: var(--color-surface, #fff); border: 1px solid var(--color-border, #ddd6c4); border-left-width: 4px; border-radius: var(--radius-md, 10px); padding: 18px 20px; }
    .technique-card.cat-narrative { border-left-color: var(--color-narrative, #1f3a5f); }
    .technique-card.cat-rhetoric { border-left-color: var(--color-jade, #2f4a3c); }
    .technique-card.cat-structure { border-left-color: var(--color-descriptive, #6b5a3f); }
    .technique-card.cat-argument { border-left-color: var(--color-argumentative, #2f4a3c); }
    .technique-card.cat-description { border-left-color: var(--color-descriptive, #6b5a3f); }
    .technique-card.cat-emotion { border-left-color: var(--color-topic, #5c4a66); }
    .technique-card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
    .technique-name { font-family: var(--font-serif, serif); font-weight: 700; font-size: 1.02rem; color: var(--color-ink, #23322b); }
    .technique-category-tag { font-size: .7rem; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
    .cat-narrative .technique-category-tag { background: var(--color-primary-soft, #e7edf3); color: var(--color-narrative, #1f3a5f); }
    .cat-rhetoric .technique-category-tag { background: #e5ece8; color: var(--color-jade, #2f4a3c); }
    .cat-structure .technique-category-tag { background: #f1ece2; color: var(--color-descriptive, #6b5a3f); }
    .cat-argument .technique-category-tag { background: #e5ece8; color: var(--color-argumentative, #2f4a3c); }
    .cat-description .technique-category-tag { background: #f1ece2; color: var(--color-descriptive, #6b5a3f); }
    .cat-emotion .technique-category-tag { background: #eee8f1; color: var(--color-topic, #5c4a66); }
    .technique-description { font-size: .88rem; color: var(--color-ink-soft, #5c6b5f); line-height: 1.75; }

    /* 命中關鍵字的地方用柔和的底色標出，跟全站低飽和度的配色一致，不用瀏覽器預設的螢光黃 */
    mark { background: #f3e3a6; color: inherit; border-radius: 2px; padding: 0 1px; }

    .status-text { padding: 20px 0; color: var(--color-ink-soft, #5c6b5f); line-height: 1.8; }
    

    @media (max-width: 720px) {
      .search-page { padding-top: calc(var(--header-height, 72px) + 30px); }
    }
  </style>
</head>
<body>
<a class="skip-link" href="#mainContent">跳至主要內容</a>

<header class="site-header">
  <div class="container nav-inner">
    <a href="index.html" class="logo">
      <span class="logo-mark">範文自學</span>
      <span class="logo-sub">DSE 中文寫作</span>
    </a>
    <button class="nav-toggle" id="navToggle" type="button" aria-label="開關選單" aria-expanded="false" aria-controls="mainNav">
      <span></span><span></span><span></span>
    </button>
    <div class="main-nav" id="mainNav">
      <nav class="nav-links" aria-label="主導航">
        <a href="genre-list.html">文體分類</a>
        <a href="questions.html">歷屆試題</a>
        <a href="techniques.html">寫作技巧</a>

      </nav>
      <form class="nav-search" role="search" action="search.html" method="get">
        <input type="search" name="q" placeholder="搜尋篇章、題目或年份…" aria-label="搜尋範文">
      </form>
    </div>

</header>

<main id="mainContent" tabindex="-1" class="search-page">
  <div class="container">

    <div class="search-head">
      <h1 id="searchHeading">搜尋</h1>
      <p class="search-hint">可以搜尋篇章全文、段旨、題目分析、篇章編號、年份、立意向度（例如「個人成長」），或寫作手法（例如「駁論法」）。</p>
    </div>

    <p class="search-summary" id="searchSummary" aria-live="polite" aria-atomic="true"></p>
    <nav class="search-jump-links" id="searchResultNav" aria-label="跳至搜尋結果類別" hidden></nav>

    <div id="searchResults">
      <p class="status-text" id="searchStatus">搜尋中…</p>
    </div>

    <div id="errorBox"></div>

  </div>
</main>

<footer class="site-footer">
  <div class="container footer-inner">
    <p>DSE 中文科範文自學平台</p>
  </div>
</footer>

<script src="site.js"></script>
<script>

  const headingEl = document.getElementById('searchHeading');
  const summaryEl = document.getElementById('searchSummary');
  const resultNavEl = document.getElementById('searchResultNav');
  const resultsEl = document.getElementById('searchResults');
  const errorBoxEl = document.getElementById('errorBox');
  const navSearchInput = document.querySelector('.nav-search input[name="q"]');

  const GENRE_LABELS = {
    narrative: '記敘抒情文',
    argumentative: '論說文',
    descriptive: '描寫文',
    topic: '話題式／開放式',
    practical: '實用寫作'
  };

  const esc = DSEHub.escapeHtml;

  const normalize = v => String(v ?? '').toLowerCase();

  const escapeRegExp = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

  /**
   * 把 text 裡命中任一個 terms 關鍵字的地方，用 <mark> 包起來。
   * 先把整段文字 escape 過（避免破壞版面或造成 XSS），再對「escape 過的文字」做關鍵字比對，
   * 所以比對用的關鍵字也要用同一套 esc() 處理，兩邊格式才會一致。
   */
  function highlight(text, terms) {
    let result = esc(text);
    terms.forEach(term => {
      if (!term) return;
      const escapedTerm = esc(term);
      const re = new RegExp(escapeRegExp(escapedTerm), 'gi');
      result = result.replace(re, matched => `<mark>${matched}</mark>`);
    });
    return result;
  }

  /** 組合索引資料和預先建立的全文索引，並保留欄位供相關度排序及命中摘要使用。 */
  function buildArticleSearchDocument(article, detail, themeNameById, questionFullByKey) {
    const themeNames = (article.themeConceptIds || []).map(id => themeNameById[id] || '').join(' ');
    const relatedText = (article.relatedQuestions || []).map(q => {
      const title = questionFullByKey[`${q.year}_${q.questionNumber}`] || '';
      return `${q.year} ${q.year}年 ${q.questionNumber} ${title}`;
    }).join(' ');

    const rawFields = {
      metadata: [
        `篇章 ${article.id}`,
        GENRE_LABELS[article.genre] || article.genre || '',
        themeNames,
        relatedText
      ].filter(Boolean).join(' · '),
      summary: article.summary || '',
      techniques: detail?.techniques || '',
      analysis: detail?.analysis || '',
      comments: detail?.comments || '',
      body: detail?.body || ''
    };
    const fields = Object.fromEntries(Object.entries(rawFields).map(([key, value]) => [key, normalize(value)]));
    return { fields, rawFields, all: Object.values(fields).join(' ') };
  }

  const ARTICLE_FIELD_INFO = {
    metadata: { label: '基本資料', weight: 50 },
    summary: { label: '內容簡介', weight: 35 },
    techniques: { label: '寫作手法', weight: 30 },
    analysis: { label: '題目分析', weight: 22 },
    comments: { label: '段旨點評', weight: 16 },
    body: { label: '正文命中', weight: 10 }
  };

  function excerpt(text, terms, maxLength = 130) {
    const source = String(text || '').replace(/\s+/g, ' ').trim();
    if (!source) return '';
    const normalized = normalize(source);
    const positions = terms.map(term => normalized.indexOf(term)).filter(position => position >= 0);
    const first = positions.length ? Math.min(...positions) : 0;
    const start = Math.max(0, first - 42);
    const end = Math.min(source.length, Math.max(first + 82, start + maxLength));
    return `${start ? '…' : ''}${source.slice(start, end).trim()}${end < source.length ? '…' : ''}`;
  }

  function evaluateArticle(article, detail, themeNameById, questionFullByKey, terms, exactQuery) {
    const document = buildArticleSearchDocument(article, detail, themeNameById, questionFullByKey);
    if (!terms.every(term => document.all.includes(term))) return null;

    let score = document.all.includes(exactQuery) ? 40 : 0;
    let bestField = 'summary';
    let bestFieldScore = -1;
    for (const [field, value] of Object.entries(document.fields)) {
      const hits = terms.filter(term => value.includes(term)).length;
      const fieldScore = hits * 100 + ARTICLE_FIELD_INFO[field].weight;
      score += hits * ARTICLE_FIELD_INFO[field].weight;
      if (hits && fieldScore > bestFieldScore) {
        bestField = field;
        bestFieldScore = fieldScore;
      }
    }

    return {
      score,
      label: ARTICLE_FIELD_INFO[bestField].label,
      snippet: excerpt(document.rawFields[bestField] || article.summary || '', terms)
    };
  }

  /** 把一條歷屆試題組成一段可搜尋的純文字。 */
  function buildQuestionSearchText(question) {
    return normalize([
      question.year,
      `${question.year}年`,
      question.questionNumber,
      question.questionFull || '',
      question.questionType || ''
    ].join(' '));
  }

  /** 把一個寫作手法組成一段可搜尋的純文字：名稱、分類、說明文字都算。 */
  function buildTechniqueSearchText(technique) {
    return normalize([
      technique.name || '',
      technique.category || '',
      technique.description || ''
    ].join(' '));
  }

  // 分類名稱轉成 CSS class 用的英文代號，跟 techniques.html 是同一套對照表，
  // 決定卡片左邊那條顏色線用哪個顏色
  const TECHNIQUE_CATEGORY_CLASS = {
    '敘事技巧': 'cat-narrative',
    '修辭手法': 'cat-rhetoric',
    '結構手法': 'cat-structure',
    '論說手法': 'cat-argument',
    '描寫手法': 'cat-description',
    '抒情手法': 'cat-emotion'
  };

  /** 找出跟這條試題（年份＋題號）對應的範文 id 清單，跟 questions.html 的邏輯一致。 */
  function relatedArticleIdsFor(question, articles) {
    return [...new Set(
      articles
        .filter(a => (a.relatedQuestions || []).some(r =>
          String(r.year) === String(question.year) &&
          String(r.questionNumber) === String(question.questionNumber)
        ))
        .map(a => a.id)
    )];
  }

  function buildArticleCardHtml(article, themeNameById, questionFullByKey, terms) {
    const firstQuestion = (article.relatedQuestions || [])[0];
    const meta = firstQuestion ? `${firstQuestion.year}年 ${firstQuestion.questionNumber}` : '年份／題號待補';
    const title = firstQuestion
      ? (questionFullByKey[`${firstQuestion.year}_${firstQuestion.questionNumber}`] || '題目待補')
      : '題目待補';
    const tags = (article.themeConceptIds || [])
      .map(id => `<span class="tag">${esc(themeNameById[id] || id)}</span>`)
      .join('');

    return `
      <a class="article-card" href="article.html?id=${encodeURIComponent(article.id)}">
        <div class="article-card-head">
          <span class="article-id">篇章 ${String(article.id).padStart(2, '0')}</span>
          <span class="article-genre-tag">${esc(GENRE_LABELS[article.genre] || article.genre)}</span>
        </div>
        <p class="article-meta">${esc(meta)}</p>
        <p class="article-question">${highlight(title, terms)}</p>
        <p class="article-summary"><span class="article-match-label">${esc(article._match.label)}</span>${highlight(article._match.snippet || article.summary || '內容簡介待補', terms)}</p>
        <div class="article-tags">${tags}</div>
        <span class="article-card-link">閱讀範文 →</span>
      </a>
    `;
  }

  function buildQuestionCardHtml(question, articles, terms) {
    const articleIds = relatedArticleIdsFor(question, articles);
    const linksHtml = articleIds.length
      ? articleIds.map(id => `<a href="article.html?id=${encodeURIComponent(id)}">查看篇章 ${String(id).padStart(2, '0')}</a>`).join('')
      : '<span class="no-article">暫未有對應範文</span>';

    return `
      <article class="question-card">
        <div class="question-card-head">
          <span class="question-year">${esc(question.year)}年</span>
          <span class="question-number">${esc(question.questionNumber)}</span>
          <span class="question-type-tag">${esc(question.questionType || '題目')}</span>
        </div>
        <p class="question-full">${highlight(question.questionFull || '題目內容待補', terms)}</p>
        <div class="question-links">${linksHtml}</div>
      </article>
    `;
  }

  function buildTechniqueCardHtml(technique, terms) {
    const categoryClass = TECHNIQUE_CATEGORY_CLASS[technique.category] || 'cat-structure';
    return `
      <a class="technique-card ${categoryClass}" href="techniques.html?highlight=${encodeURIComponent(technique.id)}">
        <div class="technique-card-head">
          <span class="technique-name">${highlight(technique.name, terms)}</span>
          <span class="technique-category-tag">${esc(technique.category)}</span>
        </div>
        <p class="technique-description">${highlight(technique.description || '', terms)}</p>
      </a>
    `;
  }

  function renderResults(query, articles, questions, techniques, searchIndexById, themeNameById, questionFullByKey) {
    const trimmedQuery = query.trim();
    headingEl.textContent = trimmedQuery ? `「${trimmedQuery}」的搜尋結果` : '搜尋';

    if (!trimmedQuery) {
      summaryEl.textContent = '請輸入關鍵字以開始搜尋。';
      if (resultNavEl) {
        resultNavEl.hidden = true;
        resultNavEl.innerHTML = '';
      }
      resultsEl.innerHTML = '<p class="status-text">請在上方輸入關鍵字，例如篇章編號、題目文字、年份，或立意向度。</p>';
      return;
    }

    // 支援多個關鍵字（用空白分隔），全部命中才算符合，查詢邏輯是「AND」不是「OR」
    const terms = normalize(trimmedQuery).split(/\s+/).filter(Boolean);

    const exactQuery = normalize(trimmedQuery);
    const matchedArticles = articles
      .map(article => {
        const match = evaluateArticle(article, searchIndexById[article.id], themeNameById, questionFullByKey, terms, exactQuery);
        return match ? { ...article, _match: match } : null;
      })
      .filter(Boolean)
      .sort((a, b) => b._match.score - a._match.score || a.id - b.id);
    const matchedQuestions = questions.filter(q =>
      terms.every(term => buildQuestionSearchText(q).includes(term))
    );
    const matchedTechniques = techniques.filter(t =>
      terms.every(term => buildTechniqueSearchText(t).includes(term))
    );

    const totalCount = matchedArticles.length + matchedQuestions.length + matchedTechniques.length;
    summaryEl.textContent = `共找到 ${totalCount} 項結果（範文 ${matchedArticles.length} 篇・試題 ${matchedQuestions.length} 條・寫作手法 ${matchedTechniques.length} 個）`;

    if (totalCount === 0) {
      if (resultNavEl) {
        resultNavEl.hidden = true;
        resultNavEl.innerHTML = '';
      }
      resultsEl.innerHTML = `<p class="status-text">沒有找到與「${esc(trimmedQuery)}」相關的內容，換個關鍵字試試——可以搜尋正文句子、段旨、年份、立意向度如「個人成長」，或寫作手法如「駁論法」。</p>`;
      return;
    }

    const jumpItems = [
      ['search-articles', '範文', matchedArticles.length],
      ['search-techniques', '寫作手法', matchedTechniques.length],
      ['search-questions', '試題', matchedQuestions.length]
    ].filter(([, , count]) => count > 0);
    if (resultNavEl) {
      resultNavEl.innerHTML = jumpItems.map(([target, label, count]) =>
        `<a class="search-jump-link" href="#${target}">${label} ${count}</a>`
      ).join('');
      resultNavEl.hidden = false;
    }

    let html = '';

    if (matchedArticles.length) {
      html += `
        <section class="result-section" id="search-articles">
          <h2>符合的範文（${matchedArticles.length}）</h2>
          <div class="article-grid">
            ${matchedArticles.map(a => buildArticleCardHtml(a, themeNameById, questionFullByKey, terms)).join('')}
          </div>
        </section>
      `;
    }

    if (matchedTechniques.length) {
      html += `
        <section class="result-section" id="search-techniques">
          <h2>符合的寫作手法（${matchedTechniques.length}）</h2>
          <div class="technique-grid">
            ${matchedTechniques.map(t => buildTechniqueCardHtml(t, terms)).join('')}
          </div>
        </section>
      `;
    }

    if (matchedQuestions.length) {
      html += `
        <section class="result-section" id="search-questions">
          <h2>符合的試題（${matchedQuestions.length}）</h2>
          <div class="question-list">
            ${matchedQuestions.map(q => buildQuestionCardHtml(q, articles, terms)).join('')}
          </div>
        </section>
      `;
    }

    resultsEl.innerHTML = html;
  }

  (async () => {
    const params = new URLSearchParams(location.search);
    const query = params.get('q') || '';

    // 把搜尋欄裡的文字補回目前的查詢字串，這樣使用者可以直接在原地修改關鍵字再送出一次
    if (navSearchInput) navSearchInput.value = query;

    try {
      const [ar, qr, tr, techR, searchR] = await Promise.all([
        fetch('data/articles.json', { cache: 'no-store' }),
        fetch('data/questions.json', { cache: 'no-store' }),
        fetch('data/themes.json', { cache: 'no-store' }),
        fetch('data/techniques.json', { cache: 'no-store' }),
        fetch('data/search-index.json', { cache: 'no-store' })
      ]);

      if (!ar.ok) throw new Error(`data/articles.json HTTP ${ar.status}`);
      if (!qr.ok) throw new Error(`data/questions.json HTTP ${qr.status}`);
      if (!tr.ok) throw new Error(`data/themes.json HTTP ${tr.status}`);
      if (!techR.ok) throw new Error(`data/techniques.json HTTP ${techR.status}`);
      if (!searchR.ok) throw new Error(`data/search-index.json HTTP ${searchR.status}`);

      const articles = await ar.json();
      const questions = await qr.json();
      const themes = await tr.json();
      const techniques = await techR.json();
      const searchIndex = await searchR.json();

      if (!Array.isArray(articles)) throw new Error('data/articles.json 必須是陣列');
      if (!Array.isArray(questions)) throw new Error('data/questions.json 必須是陣列');
      if (!Array.isArray(techniques)) throw new Error('data/techniques.json 必須是陣列');
      if (!Array.isArray(searchIndex)) throw new Error('data/search-index.json 必須是陣列');

      const themeNameById = DSEHub.nameById(themes);
      const questionFullByKey = DSEHub.questionTextByKey(questions);
      const searchIndexById = DSEHub.itemById(searchIndex);

      renderResults(query, articles, questions, techniques, searchIndexById, themeNameById, questionFullByKey);

    } catch (error) {
      console.error(error);
      summaryEl.textContent = '搜尋資料載入失敗。';
      if (resultNavEl) {
        resultNavEl.hidden = true;
        resultNavEl.innerHTML = '';
      }
      resultsEl.innerHTML = '<p class="status-text">搜尋資料載入失敗。</p>';
      errorBoxEl.innerHTML = `<div class="error-box"><strong>資料載入失敗</strong><br>${esc(error.message)}<br>請確認資料檔案已上傳，而且網站是透過伺服器開啟。</div>`;
    }
  })();
</script>

</body>
</html>
