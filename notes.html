<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的筆記｜DSE 中文科範文自學平台</title>
  <meta name="description" content="整理範文高亮、段落註解與寫作素材，並匯出或匯入本機學習筆記。">
  <link rel="stylesheet" href="style.css">
  <style>
    .notes-page { padding: calc(var(--header-height, 72px) + 48px) 0 64px; }

    .notes-head { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 8px; }
    .notes-head-text { max-width: 640px; }
    .notes-head h1 { font-size: 2rem; margin-bottom: 10px; }
    .notes-head p { color: var(--color-ink-soft, #5c6b5f); line-height: 1.8; }

    .notes-device-hint {
      font-size: .8rem;
      color: var(--color-ink-faint, #8b988e);
      background: var(--color-bg-alt, #eef0e8);
      border-radius: 8px;
      padding: 10px 14px;
      margin: 16px 0 28px;
      line-height: 1.7;
    }

    .notes-actions { display: flex; gap: 8px; flex-wrap: wrap; flex-shrink: 0; }

    .btn-notes-action {
      background: none;
      border: 1px solid var(--color-border, #ddd6c4);
      color: var(--color-ink-soft, #5c6b5f);
      border-radius: 999px;
      padding: 9px 18px;
      font-size: .85rem;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-notes-action:hover { border-color: var(--color-primary, #1f3a5f); color: var(--color-primary, #1f3a5f); }
    .btn-notes-action.btn-danger:hover { border-color: #a24b4b; color: #a24b4b; }

    .import-status-box {
      font-size: .85rem;
      padding: 10px 14px;
      border-radius: 8px;
      margin-bottom: 20px;
      line-height: 1.7;
    }
    .import-status-ok { background: var(--color-primary-soft, #e7edf3); color: var(--color-primary, #1f3a5f); }
    .import-status-error { background: #fff3f3; color: #a33; border-left: 4px solid #a33; }

    .notes-summary { font-size: .85rem; color: var(--color-ink-faint, #8b988e); margin-bottom: 16px; }

    .notes-filter-bar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin: 0 0 24px;
      padding: 12px;
      background: var(--color-bg-alt, #eef0e8);
      border-radius: 10px;
    }
    .notes-search {
      flex: 1 1 260px;
      min-width: 0;
      border: 1px solid var(--color-border, #ddd6c4);
      border-radius: 999px;
      background: #fff;
      padding: 9px 14px;
      font: inherit;
      font-size: .88rem;
      color: var(--color-ink, #23322b);
    }
    .notes-type-filter {
      border: 1px solid var(--color-border, #ddd6c4);
      border-radius: 999px;
      background: #fff;
      padding: 9px 12px;
      font: inherit;
      font-size: .84rem;
      color: var(--color-ink, #23322b);
    }
    .notes-filter-clear {
      border: 0;
      background: none;
      color: var(--color-primary, #1f3a5f);
      padding: 8px 4px;
      font-size: .82rem;
      cursor: pointer;
    }
    .notes-filter-result {
      margin-left: auto;
      font-size: .8rem;
      color: var(--color-ink-faint, #8b988e);
      white-space: nowrap;
    }

    .note-article-group {
      margin-bottom: 28px;
      background: var(--color-surface, #fff);
      border: 1px solid var(--color-border, #ddd6c4);
      border-radius: var(--radius-md, 10px);
      padding: 20px 22px;
    }

    .note-article-head {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 6px;
    }
    .note-article-title { font-size: 1rem; color: var(--color-ink, #23322b); line-height: 1.6; margin: 8px 0 14px; }
    .note-article-link { font-size: .82rem; color: var(--color-primary, #1f3a5f); margin-left: auto; }

    .note-subsection { margin-top: 16px; }
    .note-subsection:first-of-type { margin-top: 0; }
    .note-subsection h3 {
      font-size: .82rem;
      color: var(--color-ink-faint, #8b988e);
      font-weight: 600;
      margin-bottom: 10px;
    }

    .note-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 12px 14px;
      border-radius: 8px;
      margin-bottom: 8px;
      background: var(--color-bg-alt, #eef0e8);
    }
    .note-item:last-child { margin-bottom: 0; }

    .note-item-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
      margin-top: 6px;
    }
    .dot-yellow { background: #f0cf5a; }
    .dot-pink { background: #e79bb2; }
    .dot-blue { background: #7fa8d9; }
    .dot-comment { background: var(--color-primary, #1f3a5f); }
    .dot-material { background: #cba667; } /* 跟 article.html 書籤圖示同一套琥珀色系 */

    .note-item-body { flex: 1; min-width: 0; }
    .note-item-label { font-size: .74rem; color: var(--color-ink-faint, #8b988e); margin-bottom: 4px; }
    .note-item-text { font-size: .9rem; color: var(--color-ink, #23322b); line-height: 1.7; }
    .note-item-content {
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px dashed var(--color-border, #ddd6c4);
      font-size: .88rem;
      color: var(--color-ink-soft, #5c6b5f);
      line-height: 1.7;
      white-space: pre-wrap;
    }

    .note-item-actions { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; flex-shrink: 0; }
    .note-item-jump, .note-progress-link {
      color: var(--color-primary, #1f3a5f);
      font-size: .78rem;
      white-space: nowrap;
    }
    .note-item-jump:hover, .note-progress-link:hover { text-decoration: underline; }
    .note-progress-summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 12px 14px;
      border-radius: 8px;
      background: var(--color-bg-alt, #eef0e8);
    }
    .note-progress-text { margin: 0; font-size: .88rem; color: var(--color-ink-soft, #5c6b5f); line-height: 1.65; }

    .note-item-copy {
      background: none;
      border: none;
      color: var(--color-primary, #1f3a5f);
      font-size: .78rem;
      cursor: pointer;
      padding: 4px 6px;
      white-space: nowrap;
    }
    .note-item-copy:hover { text-decoration: underline; }

    .note-item-delete {
      flex-shrink: 0;
      background: none;
      border: none;
      color: var(--color-ink-faint, #8b988e);
      font-size: .78rem;
      cursor: pointer;
      padding: 4px 6px;
      white-space: nowrap;
    }
    .note-item-delete:hover { color: #a24b4b; }

    .status-text { padding: 20px 0; color: var(--color-ink-soft, #5c6b5f); line-height: 1.8; }
    .empty-state { text-align: center; padding: 60px 20px; }
    .empty-state p { color: var(--color-ink-soft, #5c6b5f); margin-bottom: 18px; }

    @media (max-width: 720px) {
      .notes-page { padding-top: calc(var(--header-height, 72px) + 30px); }
      .notes-head { flex-direction: column; }
      .note-article-link { margin-left: 0; }
      .notes-filter-bar { align-items: stretch; }
      .notes-search { flex-basis: 100%; }
      .notes-type-filter { flex: 1; }
      .notes-filter-result { width: 100%; margin-left: 0; }
      .note-item { flex-wrap: wrap; }
      .note-item-actions { width: 100%; flex-direction: row; justify-content: flex-end; }
      .note-progress-summary { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>

<header class="site-header">
  <div class="container nav-inner">
    <a href="index.html" class="logo">
      <span class="logo-mark">範文自學</span>

    </a>
    <button class="nav-toggle" id="navToggle" type="button" aria-label="開關選單" aria-expanded="false" aria-controls="mainNav">

    <div class="main-nav" id="mainNav">
      <nav class="nav-links" aria-label="主導航">

<main id="mainContent" tabindex="-1" class="notes-page">
  <div class="container">

    <div class="notes-head">
      <div class="notes-head-text">
        <h1>我的筆記</h1>
        <p>這裡整理你的段落高亮、註解、素材，以及結構分析、個人反思與審題訓練紀錄。</p>
      </div>
      <div class="notes-actions">
        <button type="button" class="btn-notes-action" id="exportBtn">匯出備份</button>
        <button type="button" class="btn-notes-action" id="importBtn">匯入備份</button>
        <input type="file" id="importFileInput" accept="application/json,.json" hidden>
        <button type="button" class="btn-notes-action btn-danger" id="clearAllBtn" hidden>清除全部學習紀錄</button>

    <p class="notes-device-hint">筆記目前只存在這台瀏覽器裡（尚未同步到雲端），換裝置或清除瀏覽器資料會遺失。建議定期按「匯出備份」把筆記存成檔案，換裝置時再用「匯入備份」讀回來。</p>

    <p class="notes-summary" id="notesSummary" hidden></p>

    <div class="notes-filter-bar" id="notesFilterBar" hidden>

      <select class="notes-type-filter" id="notesTypeFilter" aria-label="依筆記類型篩選">
        <option value="">全部類型</option>

        <option value="comment">段落註解</option>

      </select>
      <button type="button" class="notes-filter-clear" id="notesFilterClear" hidden>清除篩選</button>
      <span class="notes-filter-result" id="notesFilterResult" aria-live="polite"></span>
    </div>

<footer class="site-footer">
  <div class="container footer-inner">

  </div>

<script src="site.js"></script>
<script src="storage.js"></script>
<script src="backup.js"></script>
<script>

  const NOTES_STORAGE_KEY = DSEHub.storage.KEYS.NOTES;       // 高亮／註解，跟 article.html 用同一把 key
  const MATERIAL_STORAGE_KEY = DSEHub.storage.KEYS.MATERIALS; // 素材庫是獨立的 key，跟 article.html 的設計一致
  const ARTICLE_PROGRESS_KEY = DSEHub.storage.KEYS.ARTICLE_PROGRESS; // 結構分析／個人反思／審題訓練，同樣跟 article.html 共用

  const contentEl = document.getElementById('notesContent');
  const summaryEl = document.getElementById('notesSummary');
  const errorBoxEl = document.getElementById('errorBox');
  const clearAllBtn = document.getElementById('clearAllBtn');
  const exportBtn = document.getElementById('exportBtn');
  const importBtn = document.getElementById('importBtn');
  const importFileInput = document.getElementById('importFileInput');
  const importStatusEl = document.getElementById('importStatus');
  const filterBarEl = document.getElementById('notesFilterBar');
  const searchEl = document.getElementById('notesSearch');
  const typeFilterEl = document.getElementById('notesTypeFilter');
  const filterClearEl = document.getElementById('notesFilterClear');
  const filterResultEl = document.getElementById('notesFilterResult');
  const pageParams = new URLSearchParams(location.search);

  const GENRE_LABELS = {
    narrative: '記敘抒情文',
    argumentative: '論說文',
    descriptive: '描寫文',
    topic: '話題式／開放式',
    practical: '實用寫作'
  };

  // 高亮顏色代號轉成畫面上顯示的中文標籤，跟 article.html 選單裡的文字一致
  const HIGHLIGHT_LABELS = {
    yellow: '好詞好句',
    pink: '修辭手法',
    blue: '立意轉折'
  };

  const esc = DSEHub.escapeHtml;

  /** 讀出全部筆記，跟 article.html 的 getAllNotes() 邏輯一致。 */
  function getAllNotes() {
    return DSEHub.storage.readArray(NOTES_STORAGE_KEY, { label: '筆記資料' });
  }

  function saveAllNotes(notes) {
    const saved = DSEHub.storage.writeJson(NOTES_STORAGE_KEY, notes, { label: '筆記資料' });
    if (!saved) alert('操作失敗，可能是瀏覽器的儲存空間已滿，或目前處於無痕瀏覽模式。');
    return saved;
  }

  /** 把某一筆高亮從資料裡移除。 */
  function deleteHighlight(articleId, paragraphIndex) {
    const notes = getAllNotes().filter(n =>
      !(n.type === 'highlight' &&
        String(n.articleId) === String(articleId) &&
        n.paragraphIndex === paragraphIndex)
    );
    saveAllNotes(notes);
  }

  /** 把某一筆註解從資料裡移除。 */
  function deleteComment(articleId, paragraphIndex) {
    const notes = getAllNotes().filter(n =>
      !(n.type === 'comment' &&
        String(n.articleId) === String(articleId) &&
        n.paragraphIndex === paragraphIndex)
    );
    saveAllNotes(notes);
  }

  /** 讀出全部素材庫收藏，邏輯跟 getAllNotes() 一樣，只是換了一把 key。 */
  function getMaterialBank() {
    return DSEHub.storage.readArray(MATERIAL_STORAGE_KEY, { label: '素材庫資料' });
  }

  function saveMaterialBank(items) {
    const saved = DSEHub.storage.writeJson(MATERIAL_STORAGE_KEY, items, { label: '素材庫資料' });
    if (!saved) alert('操作失敗，可能是瀏覽器的儲存空間已滿，或目前處於無痕瀏覽模式。');
    return saved;
  }

  /** 把某一筆素材收藏移除。 */
  function deleteMaterial(articleId, paragraphIndex) {
    const items = getMaterialBank().filter(m =>
      !(String(m.articleId) === String(articleId) && m.paragraphIndex === paragraphIndex)
    );
    saveMaterialBank(items);
  }

  /** 讀出「結構分析／個人反思／審題訓練」資料，格式是物件（用 articleId 當 key），不是陣列。 */
  function getAllArticleProgress() {
    return DSEHub.storage.readObject(ARTICLE_PROGRESS_KEY, { label: '文章筆記面板資料' });
  }

  function saveAllArticleProgress(data) {
    const saved = DSEHub.storage.writeJson(ARTICLE_PROGRESS_KEY, data, { label: '文章筆記面板資料' });
    if (!saved) alert('操作失敗，可能是瀏覽器的儲存空間已滿，或目前處於無痕瀏覽模式。');
    return saved;
  }

  /**
   * 把文字複製到剪貼簿，並在按鈕上短暫顯示「已複製」作為回饋。
   * 這個動作不會改變任何資料，所以不需要重新整理列表。
   */
  function copyTextToClipboard(text, buttonEl) {
    const originalLabel = buttonEl.textContent;
    navigator.clipboard.writeText(text).then(() => {
      buttonEl.textContent = '已複製';
      setTimeout(() => { buttonEl.textContent = originalLabel; }, 1500);
    }).catch(err => {
      console.error('複製失敗：', err);
      alert('複製失敗，請手動選取文字複製。');
    });
  }

  /**
   * 把「筆記」（高亮／註解）跟「素材庫」兩份不同來源的資料，合併成同一份「依文章分組」的結構，
   * 並算出每篇文章「最後更新時間」（組內最新的 timestamp），讓最近有動作的文章排前面。
   */
  function buildGroups(notes, materials, articleProgress) {
    const groups = {};

    function ensureGroup(articleId) {
      const key = String(articleId);
      if (!groups[key]) {
        groups[key] = { articleId: key, highlights: [], comments: [], materials: [], progress: null, lastTimestamp: 0 };
      }
      return groups[key];
    }

    notes.forEach(note => {
      const group = ensureGroup(note.articleId);
      if (note.type === 'highlight') group.highlights.push(note);
      if (note.type === 'comment') group.comments.push(note);
      group.lastTimestamp = Math.max(group.lastTimestamp, note.timestamp || 0);
    });

    materials.forEach(material => {
      const group = ensureGroup(material.articleId);
      group.materials.push(material);
      group.lastTimestamp = Math.max(group.lastTimestamp, material.timestamp || 0);
    });

    Object.entries(articleProgress || {}).forEach(([articleId, progress]) => {
      const group = ensureGroup(articleId);
      group.progress = progress;
      group.lastTimestamp = Math.max(group.lastTimestamp, progress?.updatedAt || 0);
    });

    Object.values(groups).forEach(group => {
      group.highlights.sort((a, b) => a.paragraphIndex - b.paragraphIndex);
      group.comments.sort((a, b) => a.paragraphIndex - b.paragraphIndex);
      group.materials.sort((a, b) => a.paragraphIndex - b.paragraphIndex);
    });

    return Object.values(groups).sort((a, b) => b.lastTimestamp - a.lastTimestamp);
  }

  function buildArticleTitle(articleMeta, questionFullByKey) {
    if (!articleMeta) return '';
    const firstQuestion = (articleMeta.relatedQuestions || [])[0];
    if (!firstQuestion) return '';
    return questionFullByKey[`${firstQuestion.year}_${firstQuestion.questionNumber}`] || '';
  }

  function notesListUrl({ restore = false } = {}) {
    const params = new URLSearchParams();
    const query = searchEl.value.trim();
    const type = typeFilterEl.value;
    if (query) params.set('q', query);
    if (type) params.set('type', type);
    if (restore) params.set('restore', '1');
    const qs = params.toString();
    return qs ? `notes.html?${qs}` : 'notes.html';
  }

  function syncFilterUrl() {
    history.replaceState(null, '', notesListUrl());
  }

  function scrollStateKey() {
    return `dse-notes-scroll:${searchEl.value.trim().toLowerCase() || 'all'}:${typeFilterEl.value || 'all'}`;
  }

  function saveScrollPosition() {
    try { sessionStorage.setItem(scrollStateKey(), String(Math.max(0, Math.round(scrollY)))); } catch {}
  }

  function restoreScrollIfNeeded() {
    const navigationType = performance.getEntriesByType?.('navigation')?.[0]?.type;
    if (pageParams.get('restore') !== '1' && navigationType !== 'back_forward') return;
    let saved = 0;
    try { saved = Number(sessionStorage.getItem(scrollStateKey()) || 0); } catch {}
    requestAnimationFrame(() => requestAnimationFrame(() => scrollTo({ top: Number.isFinite(saved) ? saved : 0, behavior: 'auto' })));
    if (pageParams.has('restore')) history.replaceState(null, '', notesListUrl());
  }

  function articleHref(articleId, paragraphIndex = null) {
    const params = new URLSearchParams({ id: String(articleId), returnTo: notesListUrl() });
    if (Number.isInteger(paragraphIndex) && paragraphIndex >= 0) params.set('paragraph', String(paragraphIndex));
    return `article.html?${params.toString()}`;
  }

  function buildItemActionsHtml(articleId, paragraphIndex, extraHtml = '') {
    return `<div class="note-item-actions"><a class="note-item-jump" href="${esc(articleHref(articleId, paragraphIndex))}">回到原段落</a>${extraHtml}</div>`;
  }

  function progressLabels(progress) {
    if (!progress) return [];
    const labels = [];
    if (String(progress.structureNote || '').trim()) labels.push('結構分析');
    if (String(progress.reflectionNote || '').trim()) labels.push('個人反思');
    if (String(progress.trainingModeAnswer || '').trim() || progress.trainingModeRevealed) labels.push('審題訓練');
    return labels;
  }

  function cloneGroupForFilter(group, articleById, questionFullByKey, query, type) {
    const articleMeta = articleById[group.articleId];
    const title = buildArticleTitle(articleMeta, questionFullByKey);
    const metadataText = [
      group.articleId,
      `篇章 ${String(group.articleId).padStart(2, '0')}`,
      title,
      articleMeta?.genre || '',
      articleMeta ? (GENRE_LABELS[articleMeta.genre] || '') : ''
    ].join(' ').toLowerCase();
    const q = query.toLowerCase();
    const metadataMatches = !q || metadataText.includes(q);
    const matchesText = value => !q || String(value || '').toLowerCase().includes(q);

    const filtered = {
      ...group,
      highlights: type && type !== 'highlight' ? [] : group.highlights.filter(item => metadataMatches || matchesText(item.text) || matchesText(HIGHLIGHT_LABELS[item.color])),
      comments: type && type !== 'comment' ? [] : group.comments.filter(item => metadataMatches || matchesText(item.text) || matchesText(item.noteContent)),
      materials: type && type !== 'material' ? [] : group.materials.filter(item => metadataMatches || matchesText(item.text)),
      progress: type && type !== 'progress' ? null : group.progress
    };

    if (filtered.progress && q && !metadataMatches) {
      const progressText = [
        filtered.progress.structureNote,
        filtered.progress.reflectionNote,
        filtered.progress.trainingModeAnswer,
        ...progressLabels(filtered.progress)
      ].join(' ').toLowerCase();
      if (!progressText.includes(q)) filtered.progress = null;
    }

    const hasContent = filtered.highlights.length || filtered.comments.length || filtered.materials.length || filtered.progress;
    return hasContent ? filtered : null;
  }

  function buildHighlightItemHtml(note) {
    const dotClass = `dot-${note.color}`;
    const label = HIGHLIGHT_LABELS[note.color] || note.color;
    return `
      <div class="note-item" data-type="highlight" data-article-id="${esc(note.articleId)}" data-paragraph-index="${note.paragraphIndex}">
        <span class="note-item-dot ${dotClass}"></span>
        <div class="note-item-body">
          <p class="note-item-label">第 ${note.paragraphIndex + 1} 段・${esc(label)}</p>
          <p class="note-item-text">${esc(note.text || '')}</p>
        </div>
        ${buildItemActionsHtml(note.articleId, note.paragraphIndex, '<button type="button" class="note-item-delete" data-action="delete-highlight">移除</button>')}
      </div>
    `;
  }

  function buildCommentItemHtml(note) {
    return `
      <div class="note-item" data-type="comment" data-article-id="${esc(note.articleId)}" data-paragraph-index="${note.paragraphIndex}">
        <span class="note-item-dot dot-comment"></span>
        <div class="note-item-body">
          <p class="note-item-label">第 ${note.paragraphIndex + 1} 段</p>
          <p class="note-item-text">${esc(note.text || '')}</p>
          <p class="note-item-content">${esc(note.noteContent || '')}</p>
        </div>
        ${buildItemActionsHtml(note.articleId, note.paragraphIndex, '<button type="button" class="note-item-delete" data-action="delete-comment">刪除</button>')}
      </div>
    `;
  }

  function buildMaterialItemHtml(material) {
    return `
      <div class="note-item" data-type="material" data-article-id="${esc(material.articleId)}" data-paragraph-index="${material.paragraphIndex}">
        <span class="note-item-dot dot-material"></span>
        <div class="note-item-body">
          <p class="note-item-label">第 ${material.paragraphIndex + 1} 段</p>
          <p class="note-item-text">${esc(material.text || '')}</p>
        </div>
        ${buildItemActionsHtml(material.articleId, material.paragraphIndex, '<button type="button" class="note-item-copy" data-action="copy-material">複製</button><button type="button" class="note-item-delete" data-action="delete-material">移除</button>')}
      </div>
    `;
  }

  function buildArticleGroupHtml(group, articleById, questionFullByKey) {
    const articleMeta = articleById[group.articleId];
    const paddedId = String(group.articleId).padStart(2, '0');
    const genreLabel = articleMeta ? (GENRE_LABELS[articleMeta.genre] || articleMeta.genre) : '';
    const title = buildArticleTitle(articleMeta, questionFullByKey);

    const highlightsHtml = group.highlights.length
      ? `<div class="note-subsection"><h3>高亮段落（${group.highlights.length}）</h3>${group.highlights.map(buildHighlightItemHtml).join('')}</div>`
      : '';

    const materialsHtml = group.materials.length
      ? `<div class="note-subsection"><h3>收藏的素材（${group.materials.length}）</h3>${group.materials.map(buildMaterialItemHtml).join('')}</div>`
      : '';

    const commentsHtml = group.comments.length
      ? `<div class="note-subsection"><h3>段落註解（${group.comments.length}）</h3>${group.comments.map(buildCommentItemHtml).join('')}</div>`
      : '';

    const progressTypes = progressLabels(group.progress);
    const progressHtml = group.progress
      ? `<div class="note-subsection"><h3>文章學習紀錄</h3><div class="note-progress-summary"><p class="note-progress-text">${progressTypes.length ? `已保存：${esc(progressTypes.join('、'))}` : '已保存文章學習進度。'}</p><a class="note-progress-link" href="${esc(articleHref(group.articleId))}">查看／繼續 →</a></div></div>`
      : '';

    return `
      <section class="note-article-group">
        <div class="note-article-head">
          <span class="article-id">篇章 ${esc(paddedId)}</span>
          ${genreLabel ? `<span class="article-genre-tag">${esc(genreLabel)}</span>` : ''}
          <a class="note-article-link" href="${esc(articleHref(group.articleId))}">前往範文 →</a>
        </div>
        ${title ? `<p class="note-article-title">${esc(title)}</p>` : ''}
        ${highlightsHtml}
        ${materialsHtml}
        ${commentsHtml}
        ${progressHtml}
      </section>
    `;
  }

  /**
   * 把目前三份資料（高亮／註解、素材庫、結構分析等）打包成一個 JSON 檔案，觸發瀏覽器下載。
   * 檔名帶日期，方便自己分辨是哪一次的備份。
   */
  function exportBackup() {
    const backup = {
      exportedAt: new Date().toISOString(),
      version: 1, // 之後如果資料格式有變動，可以用這個欄位判斷舊備份還相不相容
      dse_notes: getAllNotes(),
      materialBank: getMaterialBank(),
      articleProgress: getAllArticleProgress()
    };

    const jsonText = JSON.stringify(backup, null, 2);
    const blob = new Blob([jsonText], { type: 'application/json' });
    const url = URL.createObjectURL(blob);

    const dateStr = new Date().toISOString().slice(0, 10); // YYYY-MM-DD
    const link = document.createElement('a');
    link.href = url;
    link.download = `dse-notes-backup-${dateStr}.json`;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);

    // 下載觸發後這個暫時的物件網址就沒用了，釋放掉避免累積
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  /**
   * 合併兩份陣列型資料（高亮／註解、素材庫都是這個形狀）：
   * 用 keyFn 算出的字串判斷「是不是同一筆」，遇到重複的就比 timestamp，留下比較新的那筆；
   * 匯入檔案裡有、但目前資料裡沒有的，就直接加進來。
   */
  function mergeArrayByKey(existingArr, importedArr, keyFn) {
    const merged = existingArr.slice();
    const indexByKey = new Map();
    merged.forEach((item, i) => indexByKey.set(keyFn(item), i));

    let addedCount = 0;
    let updatedCount = 0;

    importedArr.forEach(importedItem => {
      const key = keyFn(importedItem);
      if (indexByKey.has(key)) {
        const i = indexByKey.get(key);
        if ((importedItem.timestamp || 0) > (merged[i].timestamp || 0)) {
          merged[i] = importedItem;
          updatedCount++;
        }
      } else {
        merged.push(importedItem);
        indexByKey.set(key, merged.length - 1);
        addedCount++;
      }
    });

    return { merged, addedCount, updatedCount };
  }

  /** 合併 articleProgress（用 articleId 當 key 的物件，不是陣列），邏輯跟上面類似，一樣是比 updatedAt。 */
  function mergeArticleProgress(existing, imported) {
    const merged = Object.assign({}, existing);
    let addedCount = 0;
    let updatedCount = 0;

    Object.keys(imported || {}).forEach(articleId => {
      const importedRecord = imported[articleId];
      const existingRecord = merged[articleId];

      if (!existingRecord) {
        merged[articleId] = importedRecord;
        addedCount++;
      } else if ((importedRecord.updatedAt || 0) > (existingRecord.updatedAt || 0)) {
        merged[articleId] = importedRecord;
        updatedCount++;
      }
    });

    return { merged, addedCount, updatedCount };
  }

  function showImportStatus(message, isError) {
    importStatusEl.hidden = false;
    importStatusEl.textContent = message;
    importStatusEl.classList.toggle('import-status-error', isError);
    importStatusEl.classList.toggle('import-status-ok', !isError);
  }

  /**
   * 讀取使用者選的備份檔案，驗證格式，跟目前資料「合併」（不會覆蓋或刪除現有內容）。
   * 合併而不是直接取代，是刻意的：這樣就算選錯檔案，最多只是多了一些舊資料，不會把現有筆記洗掉。
   */
  function handleImportFile(event, articleById, questionFullByKey) {
    const file = event.target.files[0];
    event.target.value = ''; // 清空，這樣使用者重選同一個檔案也能再次觸發 change 事件
    if (!file) return;

    const reader = new FileReader();

    reader.onload = () => {
      let backup;
      try {
        backup = JSON.parse(reader.result);
      } catch (err) {
        showImportStatus('這不是有效的 JSON 檔案，匯入失敗。', true);
        return;
      }

      if (!backup || typeof backup !== 'object') {
        showImportStatus('備份檔案格式不正確，匯入失敗。', true);
        return;
      }

      const validation = DSEHub.backup.sanitizeBackup(backup);
      if (!validation.ok) {
        showImportStatus(`${validation.error} 匯入失敗。`, true);
        return;
      }

      const importedNotes = validation.data.dse_notes;
      const importedMaterials = validation.data.materialBank;
      const importedProgress = validation.data.articleProgress;
      const invalidCount = validation.invalidCount;

      if (importedNotes.length === 0 && importedMaterials.length === 0 && Object.keys(importedProgress).length === 0) {
        const skipped = invalidCount ? `（已略過 ${invalidCount} 筆無效資料）` : '';
        showImportStatus(`這份備份檔案裡沒有可匯入的有效筆記內容。${skipped}`, true);
        return;
      }

      const skippedHint = invalidCount ? `\n\n已檢查內容，其中 ${invalidCount} 筆無效資料將被略過。` : '';
      const confirmed = confirm(`確定要匯入這份備份嗎？內容會跟目前的筆記合併，不會覆蓋或刪除現有資料。${skippedHint}`);
      if (!confirmed) return;

      const notesResult = mergeArrayByKey(getAllNotes(), importedNotes, n => `${n.articleId}_${n.paragraphIndex}_${n.type}`);
      const materialsResult = mergeArrayByKey(getMaterialBank(), importedMaterials, m => `${m.articleId}_${m.paragraphIndex}`);
      const progressResult = mergeArticleProgress(getAllArticleProgress(), importedProgress);

      const saved = [
        saveAllNotes(notesResult.merged),
        saveMaterialBank(materialsResult.merged),
        saveAllArticleProgress(progressResult.merged)
      ].every(Boolean);

      if (!saved) {
        showImportStatus('匯入未能完整儲存，請檢查瀏覽器儲存空間後重試。', true);
        return;
      }

      const totalAdded = notesResult.addedCount + materialsResult.addedCount + progressResult.addedCount;
      const totalUpdated = notesResult.updatedCount + materialsResult.updatedCount + progressResult.updatedCount;

      const skippedSummary = invalidCount ? `、略過 ${invalidCount} 筆無效資料` : '';
      showImportStatus(`匯入完成：新增 ${totalAdded} 筆、更新 ${totalUpdated} 筆${skippedSummary}。`, false);
      render(articleById, questionFullByKey);
    };

    reader.onerror = () => {
      showImportStatus('讀取檔案時發生錯誤，請重試一次。', true);
    };

    reader.readAsText(file);
  }

  function renderEmptyState() {
    contentEl.innerHTML = `
      <div class="empty-state">
        <p>目前還沒有任何筆記或收藏。打開一篇範文，試試幫段落標色、加註解，或存入素材庫，內容會自動出現在這裡。</p>
        <a class="btn btn-primary" href="genre-list.html">去瀏覽範文</a>
      </div>
    `;
  }

  function render(articleById, questionFullByKey) {
    const notes = getAllNotes();
    const materials = getMaterialBank();
    const articleProgress = getAllArticleProgress();
    const progressCount = Object.keys(articleProgress).length;

    if (notes.length === 0 && materials.length === 0 && progressCount === 0) {
      summaryEl.hidden = true;
      filterBarEl.hidden = true;
      clearAllBtn.hidden = true;
      renderEmptyState();
      return;
    }

    const groups = buildGroups(notes, materials, articleProgress);
    const highlightCount = notes.filter(n => n.type === 'highlight').length;
    const commentCount = notes.filter(n => n.type === 'comment').length;
    const materialCount = materials.length;
    const query = searchEl.value.trim();
    const type = typeFilterEl.value;
    const filteredGroups = groups.map(group => cloneGroupForFilter(group, articleById, questionFullByKey, query, type)).filter(Boolean);
    const hasFilters = Boolean(query || type);

    summaryEl.hidden = false;
    summaryEl.textContent = `共 ${groups.length} 篇有學習紀錄・高亮 ${highlightCount} 段・註解 ${commentCount} 則・素材 ${materialCount} 則・文章學習紀錄 ${progressCount} 篇`;
    filterBarEl.hidden = false;
    filterClearEl.hidden = !hasFilters;
    filterResultEl.textContent = hasFilters ? `顯示 ${filteredGroups.length}／${groups.length} 篇` : `共 ${groups.length} 篇`;
    clearAllBtn.hidden = false;

    if (filteredGroups.length === 0) {
      contentEl.innerHTML = `
        <div class="empty-state">
          <p>沒有符合目前搜尋或類型篩選的筆記。</p>
          <button type="button" class="btn btn-primary" data-action="clear-note-filters">清除篩選</button>
        </div>
      `;
      return;
    }

    contentEl.innerHTML = filteredGroups.map(g => buildArticleGroupHtml(g, articleById, questionFullByKey)).join('');
  }

  function wireContentInteractions(articleById, questionFullByKey) {
    contentEl.addEventListener('click', (event) => {
      const clearFiltersBtn = event.target.closest('[data-action="clear-note-filters"]');
      if (clearFiltersBtn) {
        searchEl.value = '';
        typeFilterEl.value = '';
        syncFilterUrl();
        render(articleById, questionFullByKey);
        searchEl.focus();
        return;
      }

      const outboundLink = event.target.closest('.note-item-jump, .note-article-link, .note-progress-link');
      if (outboundLink) saveScrollPosition();

      // 複製素材文字：純粹讀取，不改資料，不用重新整理列表
      const copyBtn = event.target.closest('.note-item-copy');
      if (copyBtn) {
        const itemEl = copyBtn.closest('.note-item');
        const textEl = itemEl.querySelector('.note-item-text');
        copyTextToClipboard(textEl ? textEl.textContent : '', copyBtn);
        return;
      }

      const deleteBtn = event.target.closest('.note-item-delete');
      if (!deleteBtn) return;

      const itemEl = deleteBtn.closest('.note-item');
      const articleId = itemEl.dataset.articleId;
      const paragraphIndex = Number(itemEl.dataset.paragraphIndex);
      const action = deleteBtn.dataset.action;

      if (action === 'delete-highlight') {
        deleteHighlight(articleId, paragraphIndex);
      } else if (action === 'delete-comment') {
        deleteComment(articleId, paragraphIndex);
      } else if (action === 'delete-material') {
        deleteMaterial(articleId, paragraphIndex);
      }

      // 刪除後重新整理整個列表，比只移除單一 DOM 節點更保險
      // （不然「共 X 篇文章有紀錄」這類統計數字會跟畫面兜不起來）
      render(articleById, questionFullByKey);
    });

    clearAllBtn.addEventListener('click', () => {
      const confirmed = confirm('確定要清除全部學習紀錄嗎？這會刪除高亮、段落註解、素材庫收藏、結構分析、個人反思及審題訓練，而且無法復原。');
      if (!confirmed) return;

      const saved = [
        saveAllNotes([]),
        saveMaterialBank([]),
        saveAllArticleProgress({})
      ].every(Boolean);

      if (!saved) {
        showImportStatus('未能完整清除學習紀錄，請檢查瀏覽器儲存空間後重試。', true);
        return;
      }

      showImportStatus('已清除全部學習紀錄。', false);
      render(articleById, questionFullByKey);
    });

    exportBtn.addEventListener('click', exportBackup);

    importBtn.addEventListener('click', () => importFileInput.click());
    importFileInput.addEventListener('change', (event) => handleImportFile(event, articleById, questionFullByKey));

    let searchTimer = null;
    searchEl.addEventListener('input', () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        syncFilterUrl();
        render(articleById, questionFullByKey);
      }, 120);
    });
    typeFilterEl.addEventListener('change', () => {
      syncFilterUrl();
      render(articleById, questionFullByKey);
    });
    filterClearEl.addEventListener('click', () => {
      searchEl.value = '';
      typeFilterEl.value = '';
      syncFilterUrl();
      render(articleById, questionFullByKey);
      searchEl.focus();
    });
    addEventListener('pagehide', saveScrollPosition);
  }

  (async () => {
    try {
      const [ar, qr] = await Promise.all([
        fetch('data/articles.json', { cache: 'no-store' }),
        fetch('data/questions.json', { cache: 'no-store' })
      ]);

      if (!ar.ok) throw new Error(`data/articles.json HTTP ${ar.status}`);
      if (!qr.ok) throw new Error(`data/questions.json HTTP ${qr.status}`);

      const articles = await ar.json();
      const questions = await qr.json();

      if (!Array.isArray(articles)) throw new Error('data/articles.json 必須是陣列');
      if (!Array.isArray(questions)) throw new Error('data/questions.json 必須是陣列');

      const articleById = DSEHub.itemById(articles);
      const questionFullByKey = DSEHub.questionTextByKey(questions);

      const requestedType = pageParams.get('type') || '';
      searchEl.value = pageParams.get('q') || '';
      typeFilterEl.value = ['highlight', 'comment', 'material', 'progress'].includes(requestedType) ? requestedType : '';

      wireContentInteractions(articleById, questionFullByKey);
      render(articleById, questionFullByKey);
      restoreScrollIfNeeded();

    } catch (error) {
      console.error(error);
      // 就算文章資料讀取失敗，筆記本身還是存在 LocalStorage 裡，
      // 所以這裡退而求其次：article/question 資料查不到時，就不顯示文體與題目，只顯示篇章編號跟筆記內容
      const requestedType = pageParams.get('type') || '';
      searchEl.value = pageParams.get('q') || '';
      typeFilterEl.value = ['highlight', 'comment', 'material', 'progress'].includes(requestedType) ? requestedType : '';
      wireContentInteractions({}, {});
      render({}, {});
      restoreScrollIfNeeded();
      errorBoxEl.innerHTML = `<div class="error-box"><strong>提醒：</strong>文章資訊（文體、題目）載入失敗，以下筆記僅顯示篇章編號。<br>${esc(error.message)}</div>`;
    }
  })();
</script>
