<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>範文閱讀｜DSE 中文科範文自學平台</title><link rel="stylesheet" href="style.css"><style>
.article-page{padding:calc(var(--header-height,72px) + 40px) 0 64px}.back-link{display:inline-block;margin-bottom:18px;color:var(--color-primary,#1f3a5f)}.article-header{margin-bottom:24px}.article-header h1{font-size:2rem;margin-bottom:10px}.article-meta-line{color:var(--color-ink-soft,#5c6b5f);font-size:.9rem}.article-summary{max-width:760px;margin:12px 0;padding:12px 15px;border-left:4px solid var(--color-primary,#1f3a5f);background:var(--color-bg-alt,#eef0e8);color:var(--color-ink-soft,#5c6b5f);line-height:1.75}.article-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}.analysis{margin-bottom:28px;overflow:hidden;background:var(--color-surface,#fff);border:1px solid var(--color-border,#ddd6c4);border-radius:var(--radius-md,10px)}.analysis summary{padding:15px 18px;cursor:pointer;color:var(--color-primary,#1f3a5f);font-weight:700}.analysis-content{padding:0 18px 18px;color:var(--color-ink-soft,#5c6b5f)}.analysis-content h3{margin:16px 0 5px;color:var(--color-ink,#23322b);font-size:1rem}.essay{max-width:820px;padding:28px 32px;background:var(--color-surface,#fff);border:1px solid var(--color-border,#ddd6c4);border-radius:var(--radius-md,10px)}.paragraph{padding:15px 0;border-bottom:1px solid var(--color-border-soft,#e7e2d3);font-family:var(--font-serif,serif);font-size:1.08rem;line-height:2}.paragraph:last-child{border-bottom:0}.paragraph-number{display:inline-block;min-width:2.3em;color:var(--color-primary,#1f3a5f);font-weight:700}.technique-tags{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 7px 2.3em}.technique-tag{padding:2px 8px;border-radius:999px;background:var(--color-primary-soft,#e7edf3);color:var(--color-primary,#1f3a5f);font-family:var(--font-sans,sans-serif);font-size:.74rem}.comment-box{margin:10px 0 0 2.3em;padding:10px 12px;border-left:3px solid var(--color-primary,#1f3a5f);background:var(--color-bg-alt,#eef0e8);color:var(--color-ink-soft,#5c6b5f);font-family:var(--font-sans,sans-serif);font-size:.9rem}.comment-box summary{cursor:pointer;color:var(--color-primary,#1f3a5f);font-size:.85rem}.loading,.error{padding:24px 0;color:var(--color-ink-soft,#5c6b5f)}.error{color:#8a2525}@media(max-width:720px){.essay{padding:20px 16px}.paragraph{font-size:1rem}.comment-box,.technique-tags{margin-left:0}}
</style></head><body>
<header class="site-header"><div class="container nav-inner"><a href="index.html" class="logo"><span class="logo-mark">範文自學</span><span class="logo-sub">DSE 中文寫作</span></a><button class="nav-toggle" id="navToggle" type="button" aria-label="開關選單" aria-expanded="false" aria-controls="mainNav"><span></span><span></span><span></span></button><div class="main-nav" id="mainNav"><nav class="nav-links" aria-label="主導航"><a href="genre-list.html">文體分類</a><a href="questions.html">歷屆試題</a><a href="techniques.html">寫作技巧</a><a href="notes.html">我的筆記</a></nav><form class="nav-search" role="search" onsubmit="return false"><input type="search" placeholder="搜尋關鍵字" aria-label="搜尋"></form></div></div></header>
<main class="article-page"><div class="container"><a class="back-link" id="backLink" href="genre.html?type=narrative">← 返回文體分類</a><div id="content"><p class="loading">正在載入範文……</p></div></div></main><footer class="site-footer"><div class="container footer-inner"><p>DSE 中文科範文自學平台</p></div></footer>
<script>
const toggle=document.getElementById('navToggle'),nav=document.getElementById('mainNav');if(toggle&&nav)toggle.addEventListener('click',()=>{const open=toggle.getAttribute('aria-expanded')==='true';toggle.setAttribute('aria-expanded',String(!open));nav.classList.toggle('is-open',!open)});const id=new URLSearchParams(location.search).get('id'),content=document.getElementById('content'),back=document.getElementById('backLink');const labels={narrative:'記敘抒情文',argumentative:'論說文',descriptive:'描寫文',topic:'話題式／開放式'};const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
function mapNames(a){const m={};(Array.isArray(a)?a:[]).forEach(x=>{if(x?.id)m[x.id]=x.name});return m}function mapQuestions(a){const m={};(Array.isArray(a)?a:[]).forEach(x=>{m[`${x.year}_${x.questionNumber}`]=x.questionFull});return m}function render(index,body,tech,theme,questions){document.title=`篇章 ${index.id}｜DSE 中文科範文自學平台`;back.href=`genre.html?type=${encodeURIComponent(index.genre||'narrative')}`;const first=index.relatedQuestions?.[0],q=first?questions[`${first.year}_${first.questionNumber}`]:'題目待補';const tags=(index.themeConceptIds||[]).map(x=>`<span class="tag">${esc(theme[x]||x)}</span>`).join('');const ps=(body.paragraphs||[]).map((p,i)=>{const ts=(p.techniqueTagIds||[]).map(x=>`<span class="technique-tag">${esc(tech[x]||x)}</span>`).join('');const c=p.comment?`<details class="comment-box"><summary>顯示段旨點評</summary><div>${esc(p.comment)}</div></details>`:'';return `<div class="paragraph"><div class="technique-tags">${ts}</div><span class="paragraph-number">${i+1}.</span>${esc(p.text)}${c}</div>`}).join('');const an=body.topicAnalysis||{};const refs=Array.isArray(an.referenceAnswerPoints)?an.referenceAnswerPoints:[];content.innerHTML=`<header class="article-header"><h1>篇章 ${String(index.id).padStart(2,'0')}</h1><p class="article-meta-line">${esc(labels[index.genre]||index.genre)}　｜　${esc(first?`${first.year}年 ${first.questionNumber}`:'年份／題號待補')}　｜　約 ${esc(index.wordCount||'')} 字</p>${index.summary?`<p class="article-summary">內容簡介：${esc(index.summary)}</p>`:''}<p class="article-meta-line">${esc(q||'題目待補')}</p><div class="article-tags">${tags}</div></header><details class="analysis"><summary>顯示審題分析</summary><div class="analysis-content"><h3>主題字詞解說</h3><p>${esc(an.keywordExplanation||'暫未提供')}</p>${an.imageryDescription?`<h3>圖畫／寓意解說</h3><p>${esc(an.imageryDescription)}</p>`:''}<h3>取材方向與立意建議</h3><p>${esc(an.directionSuggestion||'暫未提供')}</p>${refs.length?`<h3>參考立意要點</h3><ul>${refs.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}</div></details><section class="essay" aria-label="範文全文">${ps||'<p>目前尚未有段落內容。</p>'}</section>`}
(async()=>{try{if(!id)throw Error('網址缺少文章 id，例如 article.html?id=1');const [ir,ar,tr,thr,qr]=await Promise.all([fetch('data/articles.json',{cache:'no-store'}),fetch(`data/articles/article_${String(id).padStart(2,'0')}.json`,{cache:'no-store'}),fetch('data/techniques.json',{cache:'no-store'}),fetch('data/themes.json',{cache:'no-store'}),fetch('data/questions.json',{cache:'no-store'})]);if(!ir.ok)throw Error(`找不到 data/articles.json（HTTP ${ir.status}）`);if(!ar.ok)throw Error(`找不到文章內容檔 data/articles/article_${String(id).padStart(2,'0')}.json（HTTP ${ar.status}）`);const indexes=await ir.json();if(!Array.isArray(indexes))throw Error('data/articles.json 必須是索引陣列');const index=indexes.find(x=>String(x.id)===String(id));if(!index)throw Error(`索引中找不到篇章 ${id}`);const body=await ar.json();render(index,body,mapNames(tr.ok?await tr.json():[]),mapNames(thr.ok?await thr.json():[]),mapQuestions(qr.ok?await qr.json():[]))}catch(e){content.innerHTML=`<p class="error">載入文章時發生錯誤：${esc(e.message)}</p><p><a href="index.html">返回首頁</a></p>`;console.error(e)}})();
</script></body></html>
