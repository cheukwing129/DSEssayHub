<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>範文閱讀｜DSE 中文科範文自學平台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .article-page {
      padding: calc(var(--header-height, 72px) + 40px) 0 64px;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 18px;
      color: var(--color-primary, #1f3a5f);
    }

    .article-header {
      margin-bottom: 24px;
    }

    .article-header h1 {
      font-size: 2rem;
      margin-bottom: 10px;
    }

    .article-meta-line {
      color: var(--color-ink-soft, #5c6b5f);
      font-size: 0.9rem;
    }

    .article-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 12px;
    }

    .analysis {
      margin-bottom: 28px;
      overflow: hidden;
      background: var(--color-surface, #ffffff);
      border: 1px solid var(--color-border, #ddd6c4);
      border-radius: var(--radius-md, 10px);
    }

    .analysis summary {
      padding: 15px 18px;
      cursor: pointer;
      color: var(--color-primary, #1f3a5f);
      font-weight: 700;
    }

    .analysis-content {
      padding: 0 18px 18px;
      color: var(--color-ink-soft, #5c6b5f);
    }

    .analysis-content h3 {
      margin: 16px 0 5px;
      color: var(--color-ink, #23322b);
      font-size: 1rem;
    }

    .essay {
      max-width: 820px;
      padding: 28px 32px;
      background: var(--color-surface, #ffffff);
      border: 1px solid var(--color-border, #ddd6c4);
      border-radius: var(--radius-md, 10px);
    }

    .paragraph {
      padding: 15px 0;
      border-bottom: 1px solid var(--color-border-soft, #e7e2d3);
      font-family: var(--font-serif, serif);
      font-size: 1.08rem;
      line-height: 2;
    }

    .paragraph:last-child {
      border-bottom: 0;
    }

    .paragraph-number {
      display: inline-block;
      min-width: 2.3em;
      color: var(--color-primary, #1f3a5f);
      font-weight: 700;
    }

    .technique-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin: 0 0 7px 2.3em;
    }

    .technique-tag {
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--color-primary-soft, #e7edf3);
      color: var(--color-primary, #1f3a5f);
      font-family: var(--font-sans, sans-serif);
      font-size: 0.74rem;
    }

    .comment-box {
      margin: 10px 0 0 2.3em;
      padding: 10px 12px;
      border-left: 3px solid var(--color-primary, #1f3a5f);
      background: var(--color-bg-alt, #eef0e8);
      color: var(--color-ink-soft, #5c6b5f);
      font-family: var(--font-sans, sans-serif);
      font-size: 0.9rem;
    }

    .comment-box summary {
      cursor: pointer;
      color: var(--color-primary, #1f3a5f);
      font-size: 0.85rem;
    }

    .loading,
    .error {
      padding: 24px 0;
      color: var(--color-ink-soft, #5c6b5f);
    }

    .error {
      color: #8a2525;
    }

    @media (max-width: 720px) {
      .essay {
        padding: 20px 16px;
      }

      .paragraph {
        font-size: 1rem;
      }

      .comment-box,
      .technique-tags {
        margin-left: 0;
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container nav-inner">
      <a href="index.html" class="logo">
        <span class="logo-mark">範文自學</span>
        <span class="logo-sub">DSE 中文寫作</span>
      </a>

      <button class="nav-toggle" id="navToggle" type="button" aria-label="開關選單" aria-expanded="false" aria-controls="mainNav">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <div class="main-nav" id="mainNav">
        <nav class="nav-links" aria-label="主導航">
          <a href="index.html#genres">文體分類</a>
          <a href="questions.html">歷屆試題</a>
          <a href="techniques.html">寫作技巧</a>
          <a href="notes.html">我的筆記</a>
        </nav>

        <form class="nav-search" role="search" onsubmit="return false">
          <input type="search" placeholder="搜尋關鍵字" aria-label="搜尋">
        </form>
      </div>
    </div>
  </header>

  <main class="article-page">
    <div class="container">
      <a class="back-link" id="backLink" href="genre.html?type=narrative">← 返回文體分類</a>
      <div id="content"><p class="loading">正在載入範文……</p></div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>DSE 中文科範文自學平台</p>
    </div>
  </footer>

  <script>
    const navToggle = document.getElementById('navToggle');
    const mainNav = document.getElementById('mainNav');

    if (navToggle && mainNav) {
      navToggle.addEventListener('click', () => {
        const isOpen = navToggle.getAttribute('aria-expanded') === 'true';
        navToggle.setAttribute('aria-expanded', String(!isOpen));
        mainNav.classList.toggle('is-open', !isOpen);
      });
    }

    const articleId = new URLSearchParams(window.location.search).get('id');
    const contentElement = document.getElementById('content');
    const backLink = document.getElementById('backLink');

    const GENRE_LABELS = {
      narrative: '記敘抒情文',
      argumentative: '論說文',
      descriptive: '描寫文',
      topic: '話題式／開放式'
    };

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function buildObjectNameMap(items) {
      const map = {};
      const array = Array.isArray(items) ? items : [];
      array.forEach(item => {
        if (item && item.id) map[item.id] = item.name;
      });
      return map;
    }

    function buildQuestionMap(items) {
      const map = {};
      const array = Array.isArray(items) ? items : [];
      array.forEach(item => {
        if (item) map[`${item.year}_${item.questionNumber}`] = item.questionFull;
      });
      return map;
    }

    function getQuestionMeta(articleIndex) {
      const relatedQuestions = Array.isArray(articleIndex.relatedQuestions)
        ? articleIndex.relatedQuestions
        : [];

      if (relatedQuestions.length === 0) return '年份／題號待補';

      return relatedQuestions
        .map(question => `${question.year}年 ${question.questionNumber}`)
        .join('・');
    }

    function getQuestionFull(articleIndex, questionByKey) {
      const firstQuestion = Array.isArray(articleIndex.relatedQuestions)
        ? articleIndex.relatedQuestions[0]
        : null;

      if (!firstQuestion) return '（題目待補）';

      return questionByKey[`${firstQuestion.year}_${firstQuestion.questionNumber}`] || '（題目待補）';
    }

    function renderArticle(articleIndex, articleContent, techniquesById, themesById, questionByKey) {
      document.title = `篇章 ${articleIndex.id}｜DSE 中文科範文自學平台`;
      backLink.href = `genre.html?type=${encodeURIComponent(articleIndex.genre || 'narrative')}`;

      const themeTags = (articleIndex.themeConceptIds || []).map(themeId => {
        return `<span class="tag">${escapeHtml(themesById[themeId] || themeId)}</span>`;
      }).join('');

      const paragraphs = (articleContent.paragraphs || []).map((paragraph, index) => {
        const techniqueTags = (paragraph.techniqueTagIds || []).map(techniqueId => {
          return `<span class="technique-tag">${escapeHtml(techniquesById[techniqueId] || techniqueId)}</span>`;
        }).join('');

        const comment = paragraph.comment
          ? `<details class="comment-box"><summary>顯示段旨點評</summary><div>${escapeHtml(paragraph.comment)}</div></details>`
          : '';

        return `
          <div class="paragraph">
            <div class="technique-tags">${techniqueTags}</div>
            <span class="paragraph-number">${index + 1}.</span>${escapeHtml(paragraph.text)}
            ${comment}
          </div>
        `;
      }).join('');

      const analysis = articleContent.topicAnalysis || {};
      const referencePoints = Array.isArray(analysis.referenceAnswerPoints)
        ? analysis.referenceAnswerPoints
        : [];

      contentElement.innerHTML = `
        <header class="article-header">
          <h1>篇章 ${String(articleIndex.id).padStart(2, '0')}</h1>
          <p class="article-meta-line">${escapeHtml(GENRE_LABELS[articleIndex.genre] || articleIndex.genre)}　｜　${escapeHtml(getQuestionMeta(articleIndex))}　｜　約 ${escapeHtml(articleIndex.wordCount || '')} 字</p>
          <p class="article-meta-line" style="margin-top:8px">${escapeHtml(getQuestionFull(articleIndex, questionByKey))}</p>
          <div class="article-tags">${themeTags}</div>
        </header>

        <details class="analysis">
          <summary>顯示審題分析</summary>
          <div class="analysis-content">
            <h3>主題字詞解說</h3>
            <p>${escapeHtml(analysis.keywordExplanation || '暫未提供')}</p>
            ${analysis.imageryDescription ? `<h3>圖畫／寓意解說</h3><p>${escapeHtml(analysis.imageryDescription)}</p>` : ''}
            <h3>取材方向與立意建議</h3>
            <p>${escapeHtml(analysis.directionSuggestion || '暫未提供')}</p>
            ${referencePoints.length ? `<h3>參考立意要點</h3><ul>${referencePoints.map(point => `<li>${escapeHtml(point)}</li>`).join('')}</ul>` : ''}
          </div>
        </details>

        <section class="essay" aria-label="範文全文">
          ${paragraphs || '<p>目前尚未有段落內容。</p>'}
        </section>
      `;
    }

    async function loadArticlePage() {
      try {
        if (!articleId) {
          throw new Error('網址缺少文章 id，例如 article.html?id=1。');
        }

        const [indexResponse, techniquesResponse, themesResponse, questionsResponse] = await Promise.all([
          fetch('data/articles.json', { cache: 'no-store' }),
          fetch('data/techniques.json', { cache: 'no-store' }),
          fetch('data/themes.json', { cache: 'no-store' }),
          fetch('data/questions.json', { cache: 'no-store' })
        ]);

        if (!indexResponse.ok) {
          throw new Error(`找不到 data/articles.json（HTTP ${indexResponse.status}）。`);
        }

        const articleIndexes = await indexResponse.json();

        if (!Array.isArray(articleIndexes)) {
          throw new Error('data/articles.json 必須是文章索引陣列 [ ... ]。');
        }

        const articleIndex = articleIndexes.find(item => String(item.id) === String(articleId));

        if (!articleIndex) {
          throw new Error(`找不到篇章 ${articleId} 的索引資料。`);
        }

        if (!articleIndex.file) {
          throw new Error(`篇章 ${articleId} 的索引缺少 file 欄位。`);
        }

        const articleResponse = await fetch(articleIndex.file, { cache: 'no-store' });

        if (!articleResponse.ok) {
          throw new Error(`找不到文章內容檔 ${articleIndex.file}（HTTP ${articleResponse.status}）。`);
        }

        const articleContent = await articleResponse.json();
        const techniquesData = techniquesResponse.ok ? await techniquesResponse.json() : [];
        const themesData = themesResponse.ok ? await themesResponse.json() : [];
        const questionsData = questionsResponse.ok ? await questionsResponse.json() : [];

        renderArticle(
          articleIndex,
          articleContent,
          buildObjectNameMap(techniquesData),
          buildObjectNameMap(themesData),
          buildQuestionMap(questionsData)
        );
      } catch (error) {
        console.error(error);
        contentElement.innerHTML = `
          <p class="error">載入文章時發生錯誤：${escapeHtml(error.message)}</p>
          <p><a href="index.html">返回首頁</a></p>
        `;
      }
    }

    loadArticlePage();
  </script>
</body>
</html>
