.article-page{padding:calc(var(--header-height,72px) + 40px) 0 64px}.back-link{display:inline-block;margin-bottom:18px;color:var(--color-primary,#1f3a5f)}.article-header{margin-bottom:24px}.article-header h1{font-size:2rem;margin-bottom:10px}.article-meta-line{color:var(--color-ink-soft,#5c6b5f);font-size:.9rem}.article-meta-line+.article-meta-line{margin-top:10px;font-size:1rem;color:var(--color-ink,#23322b)}.article-summary{max-width:760px;margin:24px 0;padding:12px 15px;border-left:4px solid var(--color-primary,#1f3a5f);background:var(--color-bg-alt,#eef0e8);color:var(--color-ink-soft,#5c6b5f);line-height:1.75}.article-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}

/* ===================== 審題訓練模式 ===================== */
.training-card{max-width:820px;margin-bottom:28px;padding:22px 24px;background:var(--color-surface,#fff);border:1px solid var(--color-border,#ddd6c4);border-radius:var(--radius-md,10px)}
.training-title{margin:0 0 8px;font-size:1.1rem;color:var(--color-ink,#23322b);font-family:var(--font-serif,serif)}
.training-hint{font-size:.88rem;color:var(--color-ink-soft,#5c6b5f);line-height:1.75;margin:0 0 14px}
.training-textarea{width:100%;min-height:120px;resize:vertical;border:1px solid var(--color-border,#ddd6c4);border-radius:8px;padding:10px 12px;font:inherit;font-size:.92rem;color:var(--color-ink,#23322b);line-height:1.7;box-sizing:border-box;font-family:var(--font-sans,sans-serif)}
.training-save-status{font-size:.74rem;color:var(--color-ink-faint,#8b988e);margin:6px 0 0;min-height:1em}
.training-actions{margin-top:14px}
.training-reference{margin-top:20px;padding-top:20px;border-top:1px dashed var(--color-border,#ddd6c4)}
.training-reference[hidden]{display:none}
.training-reference h3{font-size:.92rem;color:var(--color-ink,#23322b);margin:0 0 10px}
.training-reference ul{margin:0 0 16px;padding-left:20px;color:var(--color-ink-soft,#5c6b5f);font-size:.9rem;line-height:1.8}
.training-empty-note{font-size:.88rem;color:var(--color-ink-faint,#8b988e);margin:0 0 16px}
.training-full-explanation{margin-top:4px;border-top:1px solid var(--color-border-soft,#e7e2d3);padding-top:12px}
.training-full-explanation summary{cursor:pointer;color:var(--color-primary,#1f3a5f);font-size:.86rem}
.training-full-explanation-content{padding-top:10px;color:var(--color-ink-soft,#5c6b5f);font-size:.9rem;line-height:1.8}
.training-full-explanation-content h4{margin:14px 0 5px;color:var(--color-ink,#23322b);font-size:.92rem}
.training-full-explanation-content h4:first-child{margin-top:0}
@media(max-width:720px){.training-card{padding:18px}}
.essay{max-width:820px;padding:28px 32px;background:var(--color-surface,#fff);border:1px solid var(--color-border,#ddd6c4);border-radius:var(--radius-md,10px)}.paragraph{padding:15px 0;border-bottom:1px solid var(--color-border-soft,#e7e2d3);font-family:var(--font-serif,serif);font-size:1.08rem;line-height:2}.paragraph:last-child{border-bottom:0}.paragraph-number{display:inline-block;min-width:2.3em;color:var(--color-primary,#1f3a5f);font-weight:700}.technique-tags{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 7px 2.3em}.technique-tag{padding:2px 8px;border-radius:999px;background:var(--color-primary-soft,#e7edf3);color:var(--color-primary,#1f3a5f);font-family:var(--font-sans,sans-serif);font-size:.74rem}.comment-box{margin:10px 0 0 2.3em;padding:10px 12px;border-left:3px solid var(--color-primary,#1f3a5f);background:var(--color-bg-alt,#eef0e8);color:var(--color-ink-soft,#5c6b5f);font-family:var(--font-sans,sans-serif);font-size:.9rem}.comment-box summary{cursor:pointer;color:var(--color-primary,#1f3a5f);font-size:.85rem}.loading,.error{padding:24px 0;color:var(--color-ink-soft,#5c6b5f)}.error{color:#8a2525}@media(max-width:720px){.essay{padding:20px 16px}.paragraph{font-size:1rem}.comment-box,.technique-tags{margin-left:0}}

/* ===================== 筆記系統 5-1：段落高亮 ===================== */
:root{
  --highlight-yellow:#fdf3c7;  /* 段落底色：好詞好句 */
  --highlight-pink:#fbe2e8;    /* 段落底色：修辭手法 */
  --highlight-blue:#dfe9f7;    /* 段落底色：立意轉折點 */
  --swatch-yellow:#f0cf5a;     /* 選單裡的顏色圓點，比段落底色濃一點，方便辨認 */
  --swatch-pink:#e79bb2;
  --swatch-blue:#7fa8d9;
}

/* 每個段落都預留右側空間放三顆圖示按鈕（標記 + 筆記 + 素材庫），並設 position:relative 讓按鈕／選單可以定位在它裡面 */
.paragraph{
  position:relative;
  padding-right:116px;
  border-radius:6px;
  transition:background-color .2s ease;
}

/* 三種高亮顏色。加了背景色之後，用負的左右外距把色塊延伸到跟原本文字對齊的視覺寬度，
   同時保留一點左右內距，看起來像螢光筆畫過的一整塊，而不是硬邦邦貼齊邊界 */
.paragraph.highlight-yellow,
.paragraph.highlight-pink,
.paragraph.highlight-blue{
  padding-left:14px;
  padding-right:130px;
  margin-left:-14px;
  margin-right:-14px;
}
.paragraph.highlight-yellow{background:var(--highlight-yellow);}
.paragraph.highlight-pink{background:var(--highlight-pink);}
.paragraph.highlight-blue{background:var(--highlight-blue);}

/* 段落右上角的小圖示按鈕：平常是空心圓圈，選了顏色後變成實心，一眼就能看出「這段已標記」 */
.highlight-btn{
  position:absolute;
  top:14px;
  right:4px;
  width:28px;
  height:28px;
  border-radius:50%;
  border:1px solid var(--color-border,#ddd6c4);
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--color-ink-faint,#8b988e);
  cursor:pointer;
  padding:0;
  transition:background .15s ease,color .15s ease,border-color .15s ease;
}
.highlight-btn svg{width:14px;height:14px;}
.highlight-btn:hover,
.highlight-btn[aria-expanded="true"]{
  color:var(--color-primary,#1f3a5f);
  border-color:var(--color-primary,#1f3a5f);
  background:var(--color-primary-soft,#e7edf3);
}
.highlight-btn.is-active{
  background:var(--color-primary,#1f3a5f);
  color:#fff;
  border-color:var(--color-primary,#1f3a5f);
}

/* 顏色選單：預設用 hidden 屬性藏起來，點按鈕才顯示，同一時間只會有一個選單是打開的 */
.highlight-menu{
  position:absolute;
  top:46px;
  right:4px;
  z-index:20;
  background:#fff;
  border:1px solid var(--color-border,#ddd6c4);
  border-radius:10px;
  box-shadow:0 6px 18px rgba(35,50,43,.14);
  padding:8px;
  display:flex;
  flex-direction:column;
  gap:2px;
  min-width:150px;
}
.highlight-menu[hidden]{display:none;}
.highlight-option{
  display:flex;
  align-items:center;
  gap:9px;
  padding:7px 10px;
  border:none;
  background:none;
  border-radius:6px;
  font-size:.85rem;
  color:var(--color-ink,#23322b);
  cursor:pointer;
  text-align:left;
  width:100%;
  font-family:var(--font-sans,sans-serif);
}
.highlight-option:hover{background:var(--color-bg-alt,#eef0e8);}
.highlight-option.material-trigger{
  border-top:1px solid var(--color-border-soft,#e7e2d3);
  margin-top:4px;
  padding-top:9px;
}
.highlight-option.highlight-clear{
  color:var(--color-ink-faint,#8b988e);
}
.highlight-option svg.option-icon{width:13px;height:13px;flex-shrink:0;}
.swatch{
  width:13px;
  height:13px;
  border-radius:50%;
  display:inline-block;
  flex-shrink:0;
  border:1px solid rgba(0,0,0,.08);
}
.swatch-yellow{background:var(--swatch-yellow);}
.swatch-pink{background:var(--swatch-pink);}
.swatch-blue{background:var(--swatch-blue);}

/* 段落旁的「有筆記」小圖示：平常整個藏起來（hidden 屬性），只有這段真的存了註解才顯示 */
.note-indicator-btn{
  position:absolute;
  top:14px;
  right:40px;
  width:28px;
  height:28px;
  border-radius:50%;
  border:1px solid var(--color-primary,#1f3a5f);
  background:var(--color-primary-soft,#e7edf3);
  color:var(--color-primary,#1f3a5f);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  padding:0;
}
.note-indicator-btn[hidden]{display:none;}
.note-indicator-btn svg{width:14px;height:14px;}

/* 段落旁的「已存入素材庫」小圖示，跟筆記圖示並排，用暖色系（琥珀色）跟筆記的藍色區分開 */
.material-indicator-btn{
  position:absolute;
  top:14px;
  right:76px;
  width:28px;
  height:28px;
  border-radius:50%;
  border:1px solid #b8935a;
  background:#f7edd3;
  color:#765014;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  padding:0;
}
.material-indicator-btn[hidden]{display:none;}
.material-indicator-btn svg{width:14px;height:14px;}

/* 註解輸入視窗：整頁置中的小對話框，桌面／手機共用同一套樣式 */
.note-modal-overlay{
  position:fixed;
  inset:0;
  background:rgba(35,50,43,.45);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:200;
  padding:20px;
}
.note-modal-overlay[hidden]{display:none;}
.note-modal{
  background:#fff;
  border-radius:14px;
  padding:20px 22px;
  max-width:440px;
  width:100%;
  box-shadow:0 12px 32px rgba(35,50,43,.22);
}
.note-modal-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:12px;
}
.note-modal-head h3{margin:0;font-size:1.05rem;color:var(--color-ink,#23322b);}
.note-modal-close{
  background:none;
  border:none;
  font-size:1.3rem;
  line-height:1;
  color:var(--color-ink-faint,#8b988e);
  cursor:pointer;
  padding:2px 6px;
}
.note-modal-textarea{
  width:100%;
  min-height:140px;
  resize:vertical;
  border:1px solid var(--color-border,#ddd6c4);
  border-radius:8px;
  padding:10px 12px;
  font:inherit;
  font-size:.92rem;
  color:var(--color-ink,#23322b);
  line-height:1.7;
  box-sizing:border-box;
  font-family:var(--font-sans,sans-serif);
}
.note-modal-actions{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-top:14px;
  gap:10px;
}
.note-modal-actions-right{display:flex;gap:8px;margin-left:auto;}
.btn-note-delete{
  background:none;
  border:none;
  color:#a24b4b;
  font-size:.85rem;
  cursor:pointer;
  padding:8px 4px;
}
.btn-note-delete[hidden]{display:none;}
.btn-note-cancel{
  background:none;
  border:1px solid var(--color-border,#ddd6c4);
  color:var(--color-ink-soft,#5c6b5f);
  border-radius:999px;
  padding:8px 16px;
  font-size:.85rem;
  cursor:pointer;
}
.btn-note-save{
  background:var(--color-primary,#1f3a5f);
  border:none;
  color:#fff;
  border-radius:999px;
  padding:8px 18px;
  font-size:.85rem;
  cursor:pointer;
}

@media(max-width:720px){
  .paragraph.highlight-yellow,
  .paragraph.highlight-pink,
  .paragraph.highlight-blue{margin-left:-8px;margin-right:-8px;padding-left:8px;}
}

/* ===================== 筆記系統 5-4：文章內筆記面板 ===================== */

/* 面板開關按鈕：固定在右下角的浮動按鈕，桌面／手機都用同一顆 */
.notebook-toggle-btn{
  position:fixed;
  bottom:24px;
  right:24px;
  z-index:150;
  background:var(--color-primary,#1f3a5f);
  color:#fff;
  border:none;
  border-radius:999px;
  padding:12px 20px;
  display:flex;
  align-items:center;
  gap:8px;
  font-size:.88rem;
  cursor:pointer;
  box-shadow:0 6px 18px rgba(35,50,43,.25);
}
.notebook-toggle-btn svg{width:16px;height:16px;}
.notebook-toggle-btn:hover{background:var(--color-primary-dark,#16283f);}

/* 面板本體：桌面版是從右側滑入的側欄，手機版（見下方 media query）改成從底部滑上來的抽屜 */
.notebook-panel{
  position:fixed;
  top:var(--header-height,72px);
  right:0;
  bottom:0;
  width:360px;
  max-width:90vw;
  background:#fff;
  border-left:1px solid var(--color-border,#ddd6c4);
  box-shadow:-8px 0 24px rgba(35,50,43,.12);
  z-index:140;
  display:flex;
  flex-direction:column;
  transform:translateX(100%);
  transition:transform .25s ease;
}
.notebook-panel.is-open{transform:translateX(0);}

.notebook-handle{display:none;}

.notebook-panel-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:16px 18px;
  border-bottom:1px solid var(--color-border-soft,#e7e2d3);
  flex-shrink:0;
}
.notebook-panel-head h3{margin:0;font-size:1rem;color:var(--color-ink,#23322b);}
.notebook-close-btn{
  background:none;
  border:none;
  font-size:1.3rem;
  line-height:1;
  color:var(--color-ink-faint,#8b988e);
  cursor:pointer;
  padding:2px 6px;
}

.notebook-tabs{display:flex;border-bottom:1px solid var(--color-border-soft,#e7e2d3);flex-shrink:0;}
.notebook-tab{
  flex:1;
  padding:11px 8px;
  background:none;
  border:none;
  font-size:.8rem;
  color:var(--color-ink-soft,#5c6b5f);
  cursor:pointer;
  border-bottom:2px solid transparent;
  font-family:var(--font-sans,sans-serif);
}
.notebook-tab.is-active{
  color:var(--color-primary,#1f3a5f);
  border-bottom-color:var(--color-primary,#1f3a5f);
  font-weight:700;
}

.notebook-tab-panels{flex:1;overflow-y:auto;padding:16px 18px;}
.notebook-tab-panel{display:none;}
.notebook-tab-panel.is-active{display:block;}

.notebook-tab-hint{font-size:.82rem;color:var(--color-ink-soft,#5c6b5f);line-height:1.7;margin-bottom:12px;}
.notebook-textarea{
  width:100%;
  min-height:220px;
  resize:vertical;
  border:1px solid var(--color-border,#ddd6c4);
  border-radius:8px;
  padding:10px 12px;
  font:inherit;
  font-size:.88rem;
  color:var(--color-ink,#23322b);
  line-height:1.7;
  box-sizing:border-box;
  font-family:var(--font-sans,sans-serif);
}
.notebook-save-status{font-size:.74rem;color:var(--color-ink-faint,#8b988e);margin-top:6px;min-height:1em;}

.notebook-list-heading{font-size:.8rem;color:var(--color-ink-faint,#8b988e);font-weight:600;margin:16px 0 8px;}
.notebook-list-heading:first-child{margin-top:0;}
.notebook-list-item{
  display:flex;
  align-items:flex-start;
  gap:8px;
  padding:10px 12px;
  border-radius:8px;
  background:var(--color-bg-alt,#eef0e8);
  margin-bottom:8px;
}
.notebook-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;margin-top:5px;}
.notebook-dot.dot-yellow{background:#f0cf5a;}
.notebook-dot.dot-pink{background:#e79bb2;}
.notebook-dot.dot-blue{background:#7fa8d9;}
.notebook-dot.dot-material{background:#cba667;}
.notebook-item-label{font-size:.72rem;color:var(--color-ink-faint,#8b988e);margin-bottom:3px;}
.notebook-item-text{font-size:.85rem;color:var(--color-ink,#23322b);line-height:1.6;}

@media(max-width:720px){
  .notebook-toggle-btn{bottom:16px;right:16px;padding:11px 16px;font-size:.82rem;}

  .notebook-panel{
    top:auto;
    left:0;
    right:0;
    bottom:0;
    width:100%;
    max-width:100%;
    height:75vh;
    border-left:none;
    border-top:1px solid var(--color-border,#ddd6c4);
    border-radius:18px 18px 0 0;
    box-shadow:0 -8px 24px rgba(35,50,43,.18);
    transform:translateY(100%);
  }
  .notebook-panel.is-open{transform:translateY(0);}

  .notebook-handle{
    display:block;
    width:40px;
    height:4px;
    background:var(--color-border,#ddd6c4);
    border-radius:999px;
    margin:10px auto 0;
    flex-shrink:0;
  }
}

<!-- 筆記面板開關按鈕：固定在右下角，桌面／手機通用 -->
<button type="button" class="notebook-toggle-btn" id="notebookToggleBtn" aria-expanded="false" aria-controls="notebookPanel">

<!-- 筆記面板本體：桌面版是右側滑入的側欄，手機版改成底部滑上的抽屜（見 style 裡的 media query） -->
<aside class="notebook-panel" id="notebookPanel" aria-hidden="true">
  <div class="notebook-handle" aria-hidden="true"></div>
  <div class="notebook-panel-head">
    <h3>這篇文章的筆記</h3>
    <button type="button" class="notebook-close-btn" id="notebookCloseBtn" aria-label="關閉筆記面板">×</button>
  </div>

  <div class="notebook-tabs" role="tablist">
    <button type="button" class="notebook-tab is-active" data-tab="structure" role="tab" aria-selected="true">結構分析</button>
    <button type="button" class="notebook-tab" data-tab="highlights" role="tab" aria-selected="false">佳句與手法</button>
    <button type="button" class="notebook-tab" data-tab="reflection" role="tab" aria-selected="false">個人反思</button>
  </div>

  <div class="notebook-tab-panels">

    <div class="notebook-tab-panel is-active" data-panel="structure">

      <textarea id="structureTextarea" class="notebook-textarea" placeholder="起：……&#10;承：……&#10;轉：……&#10;合：……"></textarea>
      <p class="notebook-save-status" id="structureSaveStatus"></p>
    </div>

    <div class="notebook-tab-panel" data-panel="highlights">
      <div id="highlightsSummaryList">
        <p class="notebook-tab-hint">目前還沒有標記任何段落。在範文裡點段落旁的圖示，選顏色來標記好詞好句、修辭手法或立意轉折點，也可以存入素材庫，內容會自動出現在這裡。</p>
      </div>
    </div>

    <div class="notebook-tab-panel" data-panel="reflection">
      <p class="notebook-tab-hint">寫下你的個人反思，或試著仿寫這篇文章用到的某個手法。</p>
      <textarea id="reflectionTextarea" class="notebook-textarea" placeholder="我的反思與仿寫練習……"></textarea>
      <p class="notebook-save-status" id="reflectionSaveStatus"></p>

<!-- ============================================================
     筆記系統 5-1：段落高亮
     這個 <script> 只放高亮功能的邏輯，跟上面讀資料／渲染範文的
     程式碼分開，方便你之後比對「這一步新增了什麼」。
     ============================================================ -->
<script>

// 所有文章的筆記（高亮／註解／素材）都存在同一把 LocalStorage key 底下，
// 用陣列裡每一筆資料的 articleId 欄位分辨屬於哪一篇文章。
const NOTES_STORAGE_KEY = 'dse_notes';

/**
 * 讀出目前存在 LocalStorage 裡的全部筆記。
 * 如果從來沒存過、或資料格式壞掉，都回傳空陣列，避免後面的程式因為 null／格式錯誤而整頁壞掉。
 */
function getAllNotes() {
  try {
    const raw = localStorage.getItem(NOTES_STORAGE_KEY);
    const parsed = raw ? JSON.parse(raw) : [];
    return Array.isArray(parsed) ? parsed : [];
  } catch (err) {
    console.error('讀取筆記資料失敗，可能是 LocalStorage 內容格式損毀：', err);
    return [];
  }
}

/**
 * 把整份筆記陣列寫回 LocalStorage。
 * 注意：這是「整包覆蓋」，所以呼叫前一定要先用 getAllNotes() 把舊資料讀出來，
 * 在那份資料上面修改，再整包存回去，不然會把其他筆記蓋掉。
 */
function saveAllNotes(notes) {
  try {
    localStorage.setItem(NOTES_STORAGE_KEY, JSON.stringify(notes));
  } catch (err) {
    // 比較常見的原因：瀏覽器無痕模式限制寫入、或是 LocalStorage 容量滿了
    console.error('儲存筆記資料失敗：', err);
    alert('筆記儲存失敗，可能是瀏覽器的儲存空間已滿，或目前處於無痕瀏覽模式。');
  }
}

/**
 * 在筆記陣列裡，找出「這篇文章、這一段」目前的高亮記錄（如果有的話）。
 * articleId 用 String() 比較，避免網址參數是字串、但資料裡存的是數字時比對失敗。
 */
function findHighlight(notes, articleId, paragraphIndex) {
  return notes.find(n =>
    n.type === 'highlight' &&
    String(n.articleId) === String(articleId) &&
    n.paragraphIndex === paragraphIndex
  );
}

/**
 * 新增或更新某一段的高亮顏色。
 * 如果這段之前已經有高亮記錄，就直接改顏色（同一段只會有一筆高亮資料）；
 * 沒有的話才新增一筆。
 */
function setHighlight(articleId, paragraphIndex, color, paragraphText) {
  const notes = getAllNotes();
  const existing = findHighlight(notes, articleId, paragraphIndex);

  if (existing) {
    existing.color = color;
    existing.text = paragraphText;
    existing.timestamp = Date.now();
  } else {
    notes.push({
      articleId: String(articleId),
      paragraphIndex,
      type: 'highlight',
      color,
      text: paragraphText,
      noteContent: '', // 這個欄位留給下一步「段落註解」使用，高亮階段先不填
      timestamp: Date.now()
    });
  }

  saveAllNotes(notes);
}

/** 清除某一段的高亮記錄（把該筆資料整個從陣列裡移除）。 */
function clearHighlight(articleId, paragraphIndex) {
  const notes = getAllNotes().filter(n =>
    !(n.type === 'highlight' &&
      String(n.articleId) === String(articleId) &&
      n.paragraphIndex === paragraphIndex)
  );
  saveAllNotes(notes);
}

/**
 * 把「顏色」反映到畫面上：幫段落的 <div class="paragraph"> 換上對應的 highlight-* class，
 * 同時讓標記按鈕變成實心（is-active），提示這段已經有標記。
 * color 傳空字串就是「清除」。
 */
function applyHighlightToParagraph(paragraphEl, color) {
  paragraphEl.classList.remove('highlight-yellow', 'highlight-pink', 'highlight-blue');
  if (color) {
    paragraphEl.classList.add(`highlight-${color}`);
  }

  const btn = paragraphEl.querySelector('.highlight-btn');
  if (btn) {
    btn.classList.toggle('is-active', Boolean(color));
  }
}

/**
 * 重新整理頁面、範文渲染完成後呼叫：
 * 把 LocalStorage 裡屬於這篇文章的高亮記錄，一一還原到對應的段落上。
 */
function restoreHighlights(articleId) {
  const notes = getAllNotes();
  document.querySelectorAll('.paragraph[data-paragraph-index]').forEach(paragraphEl => {
    const paragraphIndex = Number(paragraphEl.dataset.paragraphIndex);
    const note = findHighlight(notes, articleId, paragraphIndex);
    if (note) {
      applyHighlightToParagraph(paragraphEl, note.color);
    }
  });
}

// 記錄目前是哪一個段落的顏色選單被打開，同一時間只允許開一個，
// 打開新的之前要先關掉舊的，避免畫面上同時出現好幾個選單。
let openHighlightMenu = null;

function closeOpenHighlightMenu() {
  if (!openHighlightMenu) return;
  openHighlightMenu.menu.hidden = true;
  openHighlightMenu.btn.setAttribute('aria-expanded', 'false');
  openHighlightMenu = null;
}

/**
 * 綁定「標記按鈕」與「顏色選單」的點擊事件。
 * 因為段落是 fetch 資料回來之後才動態產生的（一開始頁面上根本沒有 .paragraph 元素），
 * 所以不能直接對每個按鈕個別綁事件，而是把事件統一綁在外層的 .essay 容器上，
 * 靠 event.target.closest() 判斷實際點到的是哪個按鈕──這個寫法叫「事件委派」。
 */
function wireHighlightInteractions(articleId) {
  const essayEl = document.querySelector('.essay');
  if (!essayEl) return;

  essayEl.addEventListener('click', (event) => {
    const highlightBtn = event.target.closest('.highlight-btn');
    const optionBtn = event.target.closest('.highlight-option');

    // 情況一：點到段落右上角的標記按鈕 → 打開／關閉這一段的顏色選單
    if (highlightBtn) {
      const paragraphEl = highlightBtn.closest('.paragraph');
      const menu = paragraphEl.querySelector('.highlight-menu');
      const isCurrentlyOpen = !menu.hidden;

      closeOpenHighlightMenu(); // 先關掉任何其他已經打開的選單

      if (!isCurrentlyOpen) {
        menu.hidden = false;
        highlightBtn.setAttribute('aria-expanded', 'true');
        openHighlightMenu = { menu, btn: highlightBtn };
      }
      // 如果原本就是打開的，上面 closeOpenHighlightMenu() 已經把它關掉了，這裡不用再做事
      return;
    }

    // 情況二：點到選單裡的某個顏色（或「清除標記」）
    if (optionBtn) {
      // 「加註解」「加入素材庫」按鈕也是 .highlight-option，但它們交給各自的函式處理，
      // 這裡要先跳過，不然會被誤判成「選了一個空顏色」而不小心把高亮清掉
      if (optionBtn.classList.contains('note-trigger')) return;
      if (optionBtn.classList.contains('material-trigger')) return;

      const paragraphEl = optionBtn.closest('.paragraph');
      const paragraphIndex = Number(paragraphEl.dataset.paragraphIndex);
      const color = optionBtn.dataset.color; // 三種顏色是 "yellow"/"pink"/"blue"，清除標記是空字串
      const textEl = paragraphEl.querySelector('.paragraph-text');
      const paragraphText = textEl ? textEl.textContent : '';

      if (color) {
        setHighlight(articleId, paragraphIndex, color, paragraphText);
      } else {
        clearHighlight(articleId, paragraphIndex);
      }
      applyHighlightToParagraph(paragraphEl, color);

      closeOpenHighlightMenu();
      return;
    }
  });

  // 點擊選單／按鈕以外的任何地方，都要把打開的選單關掉
  document.addEventListener('click', (event) => {
    if (!openHighlightMenu) return;
    const clickedInsideMenu = openHighlightMenu.menu.contains(event.target);
    const clickedTheButton = openHighlightMenu.btn.contains(event.target);
    if (!clickedInsideMenu && !clickedTheButton) {
      closeOpenHighlightMenu();
    }
  });
}

/* ===================== 筆記系統 5-2：段落註解 ===================== */

/**
 * 在筆記陣列裡，找出「這篇文章、這一段」目前的註解記錄（如果有的話）。
 * 跟高亮是分開的兩筆資料（type 不同），同一段可以同時有高亮又有註解。
 */
function findComment(notes, articleId, paragraphIndex) {
  return notes.find(n =>
    n.type === 'comment' &&
    String(n.articleId) === String(articleId) &&
    n.paragraphIndex === paragraphIndex
  );
}

/** 新增或更新某一段的註解內容。 */
function setComment(articleId, paragraphIndex, noteContent, paragraphText) {
  const notes = getAllNotes();
  const existing = findComment(notes, articleId, paragraphIndex);

  if (existing) {
    existing.noteContent = noteContent;
    existing.text = paragraphText;
    existing.timestamp = Date.now();
  } else {
    notes.push({
      articleId: String(articleId),
      paragraphIndex,
      type: 'comment',
      color: '', // 註解沒有顏色，這個欄位是留給高亮用的，這裡固定空字串
      text: paragraphText,
      noteContent,
      timestamp: Date.now()
    });
  }

  saveAllNotes(notes);
}

/** 刪除某一段的註解（把該筆資料整個從陣列裡移除）。 */
function clearComment(articleId, paragraphIndex) {
  const notes = getAllNotes().filter(n =>
    !(n.type === 'comment' &&
      String(n.articleId) === String(articleId) &&
      n.paragraphIndex === paragraphIndex)
  );
  saveAllNotes(notes);
}

/** 顯示／隱藏段落旁的「有筆記」小圖示。 */
function updateNoteIndicator(paragraphEl, hasComment) {
  if (!paragraphEl) return;
  const indicatorBtn = paragraphEl.querySelector('.note-indicator-btn');
  if (indicatorBtn) {
    indicatorBtn.hidden = !hasComment;
  }
}

/**
 * 頁面載入完成、範文渲染出來之後呼叫：
 * 把 LocalStorage 裡屬於這篇文章的註解記錄，一一還原成段落旁的「有筆記」圖示。
 */
function restoreComments(articleId) {
  const notes = getAllNotes();
  document.querySelectorAll('.paragraph[data-paragraph-index]').forEach(paragraphEl => {
    const paragraphIndex = Number(paragraphEl.dataset.paragraphIndex);
    const note = findComment(notes, articleId, paragraphIndex);
    updateNoteIndicator(paragraphEl, Boolean(note && note.noteContent));
  });
}

// 目前註解視窗是為了哪一篇文章、哪一段而打開的（關閉時會重設回 null）
let currentNoteArticleId = null;
let currentNoteParagraphIndex = null;

const noteModalOverlay = document.getElementById('noteModalOverlay');
const noteModalTextarea = document.getElementById('noteModalTextarea');
const noteModalDeleteBtn = document.getElementById('noteModalDelete');
const noteModalSaveBtn = document.getElementById('noteModalSave');
const noteModalCancelBtn = document.getElementById('noteModalCancel');
const noteModalCloseBtn = document.getElementById('noteModalClose');

/** 打開註解視窗，並把這一段已經存過的內容（如果有）填進 textarea。 */
function openNoteModal(articleId, paragraphIndex) {
  currentNoteArticleId = articleId;
  currentNoteParagraphIndex = paragraphIndex;

  const notes = getAllNotes();
  const existing = findComment(notes, articleId, paragraphIndex);

  noteModalTextarea.value = existing ? existing.noteContent : '';
  noteModalDeleteBtn.hidden = !existing; // 只有已經有筆記時才顯示「刪除筆記」

  noteModalOverlay.hidden = false;
  noteModalTextarea.focus();
}

/** 關閉註解視窗，並清空暫存狀態，避免下次打開時殘留上一段的內容。 */
function closeNoteModal() {
  noteModalOverlay.hidden = true;
  noteModalTextarea.value = '';
  currentNoteArticleId = null;
  currentNoteParagraphIndex = null;
}

if (noteModalOverlay) {

  // 按「儲存」：內容有字就存起來；如果把內容清成空白，視同刪除，不留一筆空白筆記
  noteModalSaveBtn.addEventListener('click', () => {
    if (currentNoteParagraphIndex === null) return;

    const paragraphEl = document.querySelector(`.paragraph[data-paragraph-index="${currentNoteParagraphIndex}"]`);
    const textEl = paragraphEl ? paragraphEl.querySelector('.paragraph-text') : null;
    const paragraphText = textEl ? textEl.textContent : '';
    const content = noteModalTextarea.value.trim();

    if (content) {
      setComment(currentNoteArticleId, currentNoteParagraphIndex, content, paragraphText);
      updateNoteIndicator(paragraphEl, true);
    } else {
      clearComment(currentNoteArticleId, currentNoteParagraphIndex);
      updateNoteIndicator(paragraphEl, false);
    }

    closeNoteModal();
  });

  // 按「刪除筆記」：不管 textarea 現在寫了什麼，直接整筆刪掉
  noteModalDeleteBtn.addEventListener('click', () => {
    if (currentNoteParagraphIndex === null) return;

    const paragraphEl = document.querySelector(`.paragraph[data-paragraph-index="${currentNoteParagraphIndex}"]`);
    clearComment(currentNoteArticleId, currentNoteParagraphIndex);
    updateNoteIndicator(paragraphEl, false);

    closeNoteModal();
  });

  noteModalCancelBtn.addEventListener('click', closeNoteModal);
  noteModalCloseBtn.addEventListener('click', closeNoteModal);

  // 點視窗以外的半透明背景，等同取消
  noteModalOverlay.addEventListener('click', (event) => {
    if (event.target === noteModalOverlay) {
      closeNoteModal();
    }
  });

  // 按 Esc 鍵也能關閉
  document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape' && !noteModalOverlay.hidden) {
      closeNoteModal();
    }
  });
}

/**
 * 幫「有筆記」小圖示、以及選單裡新增的「加註解」按鈕綁上點擊事件。
 * 沿用跟高亮功能一樣的事件委派寫法，理由相同：這些元素都是動態產生的。
 */
function wireCommentInteractions(articleId) {
  const essayEl = document.querySelector('.essay');
  if (!essayEl) return;

  essayEl.addEventListener('click', (event) => {
    // 點到段落旁「有筆記」的小圖示 → 直接打開這段的註解視窗（可查看／編輯／刪除）
    const indicatorBtn = event.target.closest('.note-indicator-btn');
    if (indicatorBtn) {
      const paragraphEl = indicatorBtn.closest('.paragraph');
      const paragraphIndex = Number(paragraphEl.dataset.paragraphIndex);
      openNoteModal(articleId, paragraphIndex);
      return;
    }

    // 點到顏色選單裡的「加註解」→ 關掉選單、打開同一段的註解視窗
    const noteTriggerBtn = event.target.closest('.highlight-option.note-trigger');
    if (noteTriggerBtn) {
      const paragraphEl = noteTriggerBtn.closest('.paragraph');
      const paragraphIndex = Number(paragraphEl.dataset.paragraphIndex);
      closeOpenHighlightMenu();
      openNoteModal(articleId, paragraphIndex);
      return;
    }
  });
}

/* ===================== 筆記系統 5-3：素材庫收藏 ===================== */

// 素材庫刻意存在跟高亮／註解「不同」的 LocalStorage key 底下，
// 因為它的性質比較像「收藏的好句子清單」，跟針對單一段落的個人筆記是不同用途的資料。
const MATERIAL_STORAGE_KEY = 'materialBank';

/** 讀出全部素材庫收藏。 */
function getMaterialBank() {
  try {
    const raw = localStorage.getItem(MATERIAL_STORAGE_KEY);
    const parsed = raw ? JSON.parse(raw) : [];
    return Array.isArray(parsed) ? parsed : [];
  } catch (err) {
    console.error('讀取素材庫資料失敗，可能是 LocalStorage 內容格式損毀：', err);
    return [];
  }
}

function saveMaterialBank(items) {
  try {
    localStorage.setItem(MATERIAL_STORAGE_KEY, JSON.stringify(items));
  } catch (err) {
    console.error('儲存素材庫資料失敗：', err);
    alert('操作失敗，可能是瀏覽器的儲存空間已滿，或目前處於無痕瀏覽模式。');
  }
}

/** 找出「這篇文章、這一段」是否已經存在素材庫裡。 */
function findMaterial(items, articleId, paragraphIndex) {
  return items.find(m =>
    String(m.articleId) === String(articleId) &&
    m.paragraphIndex === paragraphIndex
  );
}

/** 把某一段加入素材庫（如果已經存過就不重複加）。 */
function addToMaterialBank(articleId, paragraphIndex, paragraphText) {
  const items = getMaterialBank();
  if (findMaterial(items, articleId, paragraphIndex)) return;

  items.push({
    articleId: String(articleId),
    paragraphIndex,
    type: 'material',
    text: paragraphText,
    timestamp: Date.now()
  });
  saveMaterialBank(items);
}

/** 把某一段從素材庫移除。 */
function removeFromMaterialBank(articleId, paragraphIndex) {
  const items = getMaterialBank().filter(m =>
    !(String(m.articleId) === String(articleId) && m.paragraphIndex === paragraphIndex)
  );
  saveMaterialBank(items);
}

/**
 * 同步更新「這段是否在素材庫裡」在畫面上的兩個地方：
 * 段落旁的書籤圖示（顯示／隱藏），以及選單裡按鈕的文字（加入／移出素材庫）。
 */
function updateMaterialUI(paragraphEl, isSaved) {
  if (!paragraphEl) return;

  const indicatorBtn = paragraphEl.querySelector('.material-indicator-btn');
  if (indicatorBtn) indicatorBtn.hidden = !isSaved;

  const menuBtn = paragraphEl.querySelector('.material-trigger');
  if (menuBtn) {
    // 保留按鈕原本的圖示（svg），只把後面的文字換掉
    const icon = menuBtn.querySelector('svg');
    menuBtn.textContent = isSaved ? '移出素材庫' : '加入素材庫';
    if (icon) menuBtn.prepend(icon);
  }
}

/**
 * 頁面載入完成、範文渲染出來之後呼叫：
 * 把 LocalStorage 裡屬於這篇文章的素材庫收藏，一一還原成段落旁的書籤圖示。
 */
function restoreMaterials(articleId) {
  const items = getMaterialBank();
  document.querySelectorAll('.paragraph[data-paragraph-index]').forEach(paragraphEl => {
    const paragraphIndex = Number(paragraphEl.dataset.paragraphIndex);
    const isSaved = Boolean(findMaterial(items, articleId, paragraphIndex));
    updateMaterialUI(paragraphEl, isSaved);
  });
}

/**
 * 幫「已存入素材庫」小圖示、以及選單裡的「加入／移出素材庫」按鈕綁上點擊事件。
 * 一樣是事件委派，理由跟高亮、註解功能相同。
 */
function wireMaterialInteractions(articleId) {
  const essayEl = document.querySelector('.essay');
  if (!essayEl) return;

  essayEl.addEventListener('click', (event) => {
    // 點到段落旁的書籤圖示 → 直接移出素材庫（想重新收藏，再從選單加回來即可）
    const indicatorBtn = event.target.closest('.material-indicator-btn');
    if (indicatorBtn) {
      const paragraphEl = indicatorBtn.closest('.paragraph');
      const paragraphIndex = Number(paragraphEl.dataset.paragraphIndex);
      removeFromMaterialBank(articleId, paragraphIndex);
      updateMaterialUI(paragraphEl, false);
      return;
    }

    // 點到選單裡的「加入／移出素材庫」→ 依目前狀態切換
    const materialBtn = event.target.closest('.highlight-option.material-trigger');
    if (materialBtn) {
      const paragraphEl = materialBtn.closest('.paragraph');
      const paragraphIndex = Number(paragraphEl.dataset.paragraphIndex);
      const textEl = paragraphEl.querySelector('.paragraph-text');
      const paragraphText = textEl ? textEl.textContent : '';

      const alreadySaved = Boolean(findMaterial(getMaterialBank(), articleId, paragraphIndex));

      if (alreadySaved) {
        removeFromMaterialBank(articleId, paragraphIndex);
        updateMaterialUI(paragraphEl, false);
      } else {
        addToMaterialBank(articleId, paragraphIndex, paragraphText);
        updateMaterialUI(paragraphEl, true);
      }

      closeOpenHighlightMenu();
      return;
    }
  });
}

/* ===================== 筆記系統 5-4：文章內筆記面板 ===================== */

// 「結構分析」「個人反思」這兩則是整篇文章一則，不是逐段的，
// 所以存放方式跟高亮／註解／素材庫都不一樣：用 articleId 當 key，存在自己的物件裡。
const ARTICLE_PROGRESS_KEY = 'articleProgress';

// 高亮顏色代號轉成中文標籤，跟選單裡的文字一致（這裡重新宣告一次，
// 是因為這段程式碼要能獨立閱讀，不用跳去別的區塊找對照表）
const NOTEBOOK_HIGHLIGHT_LABELS = { yellow: '好詞好句', pink: '修辭手法', blue: '立意轉折' };

function getAllArticleProgress() {
  try {
    const raw = localStorage.getItem(ARTICLE_PROGRESS_KEY);
    const parsed = raw ? JSON.parse(raw) : {};
    // 這份資料必須是「物件」（用 articleId 當 key），不是陣列，跟其他三種筆記資料的形狀不一樣
    return (parsed && typeof parsed === 'object' && !Array.isArray(parsed)) ? parsed : {};
  } catch (err) {
    console.error('讀取文章筆記面板資料失敗，可能是 LocalStorage 內容格式損毀：', err);
    return {};
  }
}

function saveAllArticleProgress(data) {
  try {
    localStorage.setItem(ARTICLE_PROGRESS_KEY, JSON.stringify(data));
  } catch (err) {
    console.error('儲存文章筆記面板資料失敗：', err);
  }
}

function getArticleProgress(articleId) {
  const all = getAllArticleProgress();
  return all[String(articleId)] || { structureNote: '', reflectionNote: '', trainingModeAnswer: '', trainingModeRevealed: false };
}

/** 更新某篇文章的其中一個欄位（structureNote 或 reflectionNote），其餘欄位維持不變。 */
function saveArticleProgressField(articleId, field, value) {
  const all = getAllArticleProgress();
  const key = String(articleId);
  if (!all[key]) all[key] = { structureNote: '', reflectionNote: '' };
  all[key][field] = value;
  all[key].updatedAt = Date.now();
  saveAllArticleProgress(all);
}

/**
 * 簡單的 debounce：使用者停止打字一段時間後才真正執行 fn，
 * 避免每打一個字就存一次 LocalStorage（效能浪費，也沒必要）。
 */
function debounce(fn, delay) {
  let timer = null;
  return (...args) => {
    clearTimeout(timer);
    timer = setTimeout(() => fn(...args), delay);
  };
}

/** 幫一個 textarea 接上「自動儲存」：打字時顯示「正在輸入…」，停下來 600ms 後存檔並顯示儲存時間。 */
function setupAutoSaveTextarea(textareaEl, statusEl, articleId, field) {
  const debouncedSave = debounce((value) => {
    saveArticleProgressField(articleId, field, value);
    const timeText = new Date().toLocaleTimeString('zh-Hant', { hour: '2-digit', minute: '2-digit' });
    statusEl.textContent = `已自動儲存・${timeText}`;
  }, 600);

  textareaEl.addEventListener('input', () => {
    statusEl.textContent = '正在輸入…';
    debouncedSave(textareaEl.value);
  });
}

/** 把「佳句與手法」分頁的內容重新畫出來：這篇文章目前所有的高亮段落＋收藏的素材。 */
function renderNotebookHighlightsTab(articleId) {
  const container = document.getElementById('highlightsSummaryList');
  if (!container) return;

  const highlights = getAllNotes()
    .filter(n => n.type === 'highlight' && String(n.articleId) === String(articleId))
    .sort((a, b) => a.paragraphIndex - b.paragraphIndex);

  const materials = getMaterialBank()
    .filter(m => String(m.articleId) === String(articleId))
    .sort((a, b) => a.paragraphIndex - b.paragraphIndex);

  if (highlights.length === 0 && materials.length === 0) {
    container.innerHTML = '<p class="notebook-tab-hint">目前還沒有標記任何段落。在範文裡點段落旁的圖示，選顏色來標記好詞好句、修辭手法或立意轉折點，也可以存入素材庫，內容會自動出現在這裡。</p>';
    return;
  }

  let html = '';

  if (highlights.length) {
    html += `<h4 class="notebook-list-heading">高亮段落（${highlights.length}）</h4>`;
    html += highlights.map(n => `
      <div class="notebook-list-item">
        <span class="notebook-dot dot-${n.color}"></span>
        <div>
          <p class="notebook-item-label">第 ${n.paragraphIndex + 1} 段・${esc(NOTEBOOK_HIGHLIGHT_LABELS[n.color] || n.color)}</p>
          <p class="notebook-item-text">${esc(n.text || '')}</p>
        </div>
      </div>
    `).join('');
  }

  if (materials.length) {
    html += `<h4 class="notebook-list-heading">收藏的素材（${materials.length}）</h4>`;
    html += materials.map(m => `
      <div class="notebook-list-item">
        <span class="notebook-dot dot-material"></span>
        <div>
          <p class="notebook-item-label">第 ${m.paragraphIndex + 1} 段</p>
          <p class="notebook-item-text">${esc(m.text || '')}</p>
        </div>
      </div>
    `).join('');
  }

  container.innerHTML = html;
}

/** 初始化整個筆記面板：填入已存的內容、接上自動儲存、接上分頁切換、接上開關按鈕。 */
function initNotebookPanel(articleId) {
  const toggleBtn = document.getElementById('notebookToggleBtn');
  const panel = document.getElementById('notebookPanel');
  const closeBtn = document.getElementById('notebookCloseBtn');
  if (!toggleBtn || !panel || !closeBtn) return;

  // 把之前存過的結構分析／個人反思內容填回 textarea
  const progress = getArticleProgress(articleId);
  const structureTextarea = document.getElementById('structureTextarea');
  const reflectionTextarea = document.getElementById('reflectionTextarea');
  const structureSaveStatus = document.getElementById('structureSaveStatus');
  const reflectionSaveStatus = document.getElementById('reflectionSaveStatus');

  structureTextarea.value = progress.structureNote || '';
  reflectionTextarea.value = progress.reflectionNote || '';

  setupAutoSaveTextarea(structureTextarea, structureSaveStatus, articleId, 'structureNote');
  setupAutoSaveTextarea(reflectionTextarea, reflectionSaveStatus, articleId, 'reflectionNote');

  // 面板開關
  function openPanel() {
    panel.classList.add('is-open');
    panel.setAttribute('aria-hidden', 'false');
    toggleBtn.setAttribute('aria-expanded', 'true');
  }
  function closePanel() {
    panel.classList.remove('is-open');
    panel.setAttribute('aria-hidden', 'true');
    toggleBtn.setAttribute('aria-expanded', 'false');
  }

  toggleBtn.addEventListener('click', () => {
    if (panel.classList.contains('is-open')) closePanel();
    else openPanel();
  });
  closeBtn.addEventListener('click', closePanel);

  document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape' && panel.classList.contains('is-open')) closePanel();
  });

  // 分頁切換：點哪個分頁按鈕，就顯示對應的內容區塊
  const tabs = panel.querySelectorAll('.notebook-tab');
  const tabPanels = panel.querySelectorAll('.notebook-tab-panel');

  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      tabs.forEach(t => { t.classList.remove('is-active'); t.setAttribute('aria-selected', 'false'); });
      tabPanels.forEach(p => p.classList.remove('is-active'));

      tab.classList.add('is-active');
      tab.setAttribute('aria-selected', 'true');

      const targetPanel = panel.querySelector(`.notebook-tab-panel[data-panel="${tab.dataset.tab}"]`);
      if (targetPanel) targetPanel.classList.add('is-active');

      // 「佳句與手法」分頁的內容會隨時變動（使用者可能剛標記完段落），
      // 所以每次切到這個分頁都重新讀一次 LocalStorage，而不是只在頁面載入時讀一次
      if (tab.dataset.tab === 'highlights') {
        renderNotebookHighlightsTab(articleId);
      }
    });
  });
}

/* ===================== 審題訓練模式 ===================== */

/**
 * 「審題訓練」的核心邏輯很簡單：一開始只讓學生看到題目跟一個輸入框，
 * 參考答案（referenceAnswerPoints／openEndedAngles／完整解說）預設是藏起來的，
 * 學生按下「查看參考答案」才會顯示；狀態會記住，下次回來這篇文章不用重新點開。
 *
 * 學生自己寫的分析、以及「是否已經看過參考答案」這兩件事，
 * 沿用跟結構分析／個人反思一樣的 articleProgress 資料格式（同一個 articleId 底下的兩個新欄位），
 * 不需要另外開一把 LocalStorage key。
 */
function initTrainingMode(articleId) {
  const textarea = document.getElementById('trainingAnswerTextarea');
  const saveStatus = document.getElementById('trainingSaveStatus');
  const revealBtn = document.getElementById('trainingRevealBtn');
  const referenceEl = document.getElementById('trainingReference');
  if (!textarea || !revealBtn || !referenceEl) return;

  const progress = getArticleProgress(articleId);
  textarea.value = progress.trainingModeAnswer || '';
  setupAutoSaveTextarea(textarea, saveStatus, articleId, 'trainingModeAnswer');

  function setRevealed(isRevealed) {
    referenceEl.hidden = !isRevealed;
    revealBtn.setAttribute('aria-expanded', String(isRevealed));
    revealBtn.textContent = isRevealed ? '隱藏參考答案，重新練習' : '查看參考答案';
  }

  // 還原上次離開時的狀態：如果之前已經看過參考答案，這次回來就直接顯示，不用再點一次
  setRevealed(Boolean(progress.trainingModeRevealed));

  revealBtn.addEventListener('click', () => {
    const willReveal = referenceEl.hidden; // 目前是藏起來的，點下去就要變成顯示
    setRevealed(willReveal);
    saveArticleProgressField(articleId, 'trainingModeRevealed', willReveal);
  });
}
