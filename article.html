<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DSE 中文科範文</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .article-page { padding: calc(var(--header-height, 72px) + 40px) 0 64px; }
    .back-link { display: inline-block; margin-bottom: 18px; color: var(--color-primary, #1f3a5f); }
    .article-header { margin-bottom: 24px; }
    .article-header h1 { font-size: 2rem; margin: 0 0 10px; }
    .article-meta-line { color: var(--color-ink-soft, #5c6b5f); font-size: .9rem; }
    .article-summary { max-width: 760px; margin: 12px 0; padding: 12px 15px; border-left: 4px solid var(--color-primary, #1f3a5f); background: var(--color-bg-alt, #eef0e8); color: var(--color-ink-soft, #5c6b5f); line-height: 1.75; }
    .article-tags, .technique-tags { display: flex; flex-wrap: wrap; gap: 5px; }
    .article-tags { margin-top: 12px; }
    .tag, .technique-tag { padding: 2px 8px; border-radius: 999px; background: var(--color-primary-soft, #e7edf3); color: var(--color-primary, #1f3a5f); font-family: var(--font-sans, sans-serif); font-size: .74rem; }
    .analysis { margin-bottom: 28px; overflow: hidden; background: var(--color-surface, #fff); border: 1px solid var(--color-border, #ddd6c4); border-radius: var(--radius-md, 10px); }
    .analysis summary { padding: 15px 18px; cursor: pointer; color: var(--color-primary, #1f3a5f); font-weight: 700; }
    .analysis-content { padding: 0 18px 18px; color: var(--color-ink-soft, #5c6b5f); }
    .analysis-content h3 { margin: 16px 0 5px; color: var(--color-ink, #23322b); font-size: 1rem; }
    .essay { max-width: 820px; padding: 28px 32px; background: var(--color-surface, #fff); border: 1px solid var(--color-border, #ddd6c4); border-radius: var(--radius-md, 10px); }
    .paragraph { padding: 15px 0; border-bottom: 1px solid var(--color-border-soft, #e7e2d3); font-family: var(--font-serif, serif); font-size: 1.08rem; line-height: 2; }
    .paragraph:last-child { border-bottom: 0; }
    .paragraph-number { display: inline-block; min-width: 2.3em; color: var(--color-primary, #1f3a5f); font-weight: 700; }
    .technique-tags { margin: 0 0 7px 2.3em; }
    .comment-box { margin: 10px 0 0 2.3em; padding: 10px 12px; border-left: 3px solid var(--color-primary, #1f3a5f); background: var(--color-bg-alt, #eef0e8); color: var(--color-ink-soft, #5c6b5f); font-family: var(--font-sans, sans-serif); font-size: .9rem; }
    .comment-box summary { cursor: pointer; color: var(--color-primary, #1f3a5f); font-size: .85rem; }
    .loading, .error { padding: 24px 0; color: var(--color-ink-soft, #5c6b5f); }
    .error { color: #8a2525; }
    @media (max-width: 720px) { .essay { padding: 20px 16px; } .paragraph { font-size: 1rem; } .comment-box, .technique-tags { margin-left: 0; } }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container nav-inner">
      <a href="index.html" class="logo"><span class="logo-mark">文</span><span class="logo-sub">DSE 中文科</span></a>
      <button class="nav-toggle" id="navToggle" type="button" aria-label="開啟選單" aria-expanded="false" aria-controls="mainNav"><span></span><span></span><span></span></button>
      <div class="main-nav" id="mainNav">
        <nav class="nav-links" aria-label="主要導覽">
          <a href="genre-list.html">範文分類</a>
          <a href="questions.html">歷屆試題</a>
          <a href="techniques.html">寫作手法</a>
          <a href="notes.html">我的筆記</a>
        </nav>
      </div>
    </div>
  </header>

  <main class="article-page">
    <div class="container">
      <a class="back-link" id="backLink" href="genre.html?type=narrative">← 返回範文列表</a>
      <div id="content"><p class="loading">範文載入中…</p></div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner"><p>DSE 中文科範文自學平台</p></div>
  </footer>

  <script>
    const toggle = document.getElementById('navToggle');
    const nav = document.getElementById('mainNav');
    if (toggle && nav) {
      toggle.addEventListener('click', () => {
        const open = toggle.getAttribute('aria-expanded') === 'true';
        toggle.setAttribute('aria-expanded', String(!open));
        nav.classList.toggle('is-open', !open);
      });
    }

    const TECHNIQUE_ID_ALIASES = {
      t01: 'tag_flashback', t02: 'tag_sequence', t03: 'tag_flashback', t04: 'tag_echo',
      t05: 'tag_scene', t06: 'tag_character', t07: 'tag_scene', t08: 'tag_event_emotion',
      t09: 'tag_direct_emotion', t10: 'tag_dialogue', t11: 'tag_psychological',
      t12: 'tag_contrast', t13: 'tag_scene_emotion', t14: 'tag_symbolism',
      t15: 'tag_question', t16: 'tag_rhetorical_question', t17: 'tag_parallel',
      t18: 'tag_progression', t19: 'tag_metaphor', t20: 'tag_personification',
      t21: 'tag_counterargument', t22: 'tag_example', t23: 'tag_quote',
      t24: 'tag_balanced_argument', t25: 'tag_analogy', t26: 'tag_thesis',
      t27: 'tag_foreshadowing', t28: 'tag_suspense', t29: 'tag_transition',
      t30: 'tag_side_description', t31: 'tag_dynamic_static', t32: 'tag_sensory',
      t33: 'tag_detail', t34: 'tag_small_big', t35: 'tag_question'
    };

    const FALLBACK_TECHNIQUE_NAMES = {
      tag_background: '背景交代', tag_thesis: '提出主旨／點題', tag_definition: '下定義',
      tag_dialogue: '對話描寫', tag_flashback: '回憶／倒敘', tag_sequence: '順敘',
      tag_scene: '場景描寫', tag_character: '人物描寫', tag_detail: '細節描寫',
      tag_psychological: '心理描寫', tag_side_description: '側寫',
      tag_dynamic_static: '動靜結合', tag_sensory: '感官描寫',
      tag_event_emotion: '借事抒情', tag_direct_emotion: '直接抒情',
      tag_contrast: '對比襯托', tag_scene_emotion: '以景寓情', tag_symbolism: '象徵手法',
      tag_question: '設問／自問自答', tag_rhetorical_question: '反問',
      tag_parallel: '排比', tag_progression: '層遞', tag_metaphor: '比喻',
      tag_personification: '擬人', tag_repetition: '反覆',
      tag_counterargument: '反駁論點／駁論法', tag_example: '舉例／舉例論證',
      tag_quote: '引用／引用論證', tag_balanced_argument: '正反論證',
      tag_analogy: '類比論證', tag_small_big: '以小見大', tag_concession: '讓步論證',
      tag_cause_effect: '因果關係', tag_echo: '首尾呼應', tag_foreshadowing: '伏筆',
      tag_suspense: '懸念', tag_transition: '轉折', tag_ending: '反問結尾',
      tag_conclusion: '總結／結尾', tag_ending_open: '開放式結尾', tag_climax: '高潮'
    };

    const id = new URLSearchParams(location.search).get('id');
    const content = document.getElementById('content');
    const back = document.getElementById('backLink');
    const labels = { narrative: '記敘抒情文', argumentative: '論說文', descriptive: '描寫文', topic: '話題式／開放式' };

    const esc = value => String(value ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');

    function mapNames(items) {
      const names = { ...FALLBACK_TECHNIQUE_NAMES };
      if (Array.isArray(items)) {
        items.forEach(item => {
          if (item && item.id && item.name) names[item.id] = item.name;
        });
      }
      return names;
    }

    function mapQuestions(items) {
      const questions = {};
      if (Array.isArray(items)) {
        items.forEach(item => {
          questions[`${item.year}_${item.questionNumber}`] = item.questionFull || item.question || '';
        });
      }
      return questions;
    }

    function getTechniqueName(id, techniqueNameById) {
      const normalized = TECHNIQUE_ID_ALIASES[id] || id;
      return techniqueNameById[normalized] || techniqueNameById[id] || FALLBACK_TECHNIQUE_NAMES[normalized] || id;
    }

    function techniqueTagsHtml(ids, techniqueNameById) {
      if (!Array.isArray(ids)) return '';
      const seen = new Set();
      return ids.map(id => TECHNIQUE_ID_ALIASES[id] || id)
        .filter(id => {
          if (seen.has(id)) return false;
          seen.add(id);
          return true;
        })
        .map(id => `<span class="technique-tag">${esc(getTechniqueName(id, techniqueNameById))}</span>`)
        .join('');
    }

    function render(index, body, techniqueNameById, themeNameById, questions) {
      document.title = `篇章 ${index.id}｜DSE 中文科範文`;
      back.href = `genre.html?type=${encodeURIComponent(index.genre || 'narrative')}`;
      const first = index.relatedQuestions && index.relatedQuestions[0];
      const question = first ? questions[`${first.year}_${first.questionNumber}`] : '';
      const themes = (index.themeConceptIds || [])
        .map(id => `<span class="tag">${esc(themeNameById[id] || id)}</span>`).join('');
      const paragraphs = (body.paragraphs || []).map((paragraph, number) => {
        const tags = techniqueTagsHtml(paragraph.techniqueTagIds, techniqueNameById);
        const comment = paragraph.comment
          ? `<details class="comment-box"><summary>顯示段旨點評</summary><div>${esc(paragraph.comment)}</div></details>`
          : '';
        return `<div class="paragraph"><div class="technique-tags">${tags}</div><span class="paragraph-number">${number + 1}.</span><span class="paragraph-text">${esc(paragraph.text)}</span>${comment}</div>`;
      }).join('');
      const analysis = body.topicAnalysis || {};
      const references = Array.isArray(analysis.referenceAnswerPoints) ? analysis.referenceAnswerPoints : [];

      content.innerHTML = `
        <header class="article-header">
          <h1>篇章 ${String(index.id).padStart(2, '0')}</h1>
          <p class="article-meta-line">${esc(labels[index.genre] || index.genre)} ・ ${esc(first ? `${first.year}年 ${first.questionNumber}` : '')} ・ ${esc(index.wordCount || '')} 字</p>
          ${index.summary ? `<p class="article-summary">${esc(index.summary)}</p>` : ''}
          ${question ? `<p class="article-meta-line">${esc(question)}</p>` : ''}
          <div class="article-tags">${themes}</div>
        </header>
        <details class="analysis">
          <summary>查看題目分析</summary>
          <div class="analysis-content">
            ${analysis.keywordExplanation ? `<h3>審題重點</h3><p>${esc(analysis.keywordExplanation)}</p>` : ''}
            ${analysis.imageryDescription ? `<h3>意象分析</h3><p>${esc(analysis.imageryDescription)}</p>` : ''}
            ${analysis.directionSuggestion ? `<h3>寫作方向</h3><p>${esc(analysis.directionSuggestion)}</p>` : ''}
            ${references.length ? `<h3>參考答題要點</h3><ul>${references.map(point => `<li>${esc(point)}</li>`).join('')}</ul>` : ''}
          </div>
        </details>
        <section class="essay" aria-label="範文內容">${paragraphs}</section>
      `;
    }

    async function loadArticle() {
      try {
        if (!id) throw new Error('找不到篇章編號。請從範文列表重新開啟文章。');
        const articleFile = `data/articles/article_${String(id).padStart(2, '0')}.json`;
        const [indexResponse, articleResponse, techniquesResponse, themesResponse, questionsResponse] = await Promise.all([
          fetch('data/articles.json', { cache: 'no-store' }),
          fetch(articleFile, { cache: 'no-store' }),
          fetch('data/techniques.json', { cache: 'no-store' }),
          fetch('data/themes.json', { cache: 'no-store' }),
          fetch('data/questions.json', { cache: 'no-store' })
        ]);
        if (!indexResponse.ok) throw new Error(`無法讀取 data/articles.json（HTTP ${indexResponse.status}）。`);
        if (!articleResponse.ok) throw new Error(`無法讀取 ${articleFile}（HTTP ${articleResponse.status}）。`);
        const indexes = await indexResponse.json();
        if (!Array.isArray(indexes)) throw new Error('data/articles.json 的格式必須是文章陣列。');
        const index = indexes.find(item => String(item.id) === String(id));
        if (!index) throw new Error(`找不到篇章 ${id} 的索引資料。`);
        const article = await articleResponse.json();
        const techniques = techniquesResponse.ok ? await techniquesResponse.json() : [];
        const themes = themesResponse.ok ? await themesResponse.json() : [];
        const questions = questionsResponse.ok ? await questionsResponse.json() : [];
        render(index, article, mapNames(techniques), mapNames(themes), mapQuestions(questions));
      } catch (error) {
        content.innerHTML = `<p class="error">${esc(error.message)}</p><p><a href="index.html">返回首頁</a></p>`;
        console.error(error);
      }
    }

    loadArticle();
  </script>
</body>
</html>
