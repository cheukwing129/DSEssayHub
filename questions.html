<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>歷屆試題｜DSE 中文科範文</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .questions-page { padding: calc(var(--header-height, 72px) + 48px) 48px 0 64px; }
    .questions-head { max-width: 640px; margin-bottom: 28px; }
    .questions-head h1 { font-size: 2rem; margin-bottom: 10px; }
    .questions-head p { color: var(--color-ink-soft, #5c6b5f); line-height: 1.8; }
    .q-filter { display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center; margin-bottom: 24px; }
    .q-filter-group { display: flex; align-items: center; gap: 8px; }
    .q-filter label { font-size: .88rem; color: var(--color-ink-soft, #5c6b5f); }
    .q-filter select { padding: 8px 14px; border: 1px solid var(--color-border, #ddd6c4); border-radius: 999px; background: #fff; font: inherit; font-size: .88rem; color: var(--color-ink, #23322b); }
    .question-count-note { font-size: .82rem; color: var(--color-ink-faint, #8b988e); margin-bottom: 20px; }
    .question-list { display: flex; flex-direction: column; gap: 14px; }
    .question-card { display: flex; flex-direction: column; gap: 10px; background: var(--color-surface, #fff); border: 1px solid var(--color-border, #ddd6c4); border-radius: var(--radius-md, 10px); padding: 20px 22px; }
    .question-card-head { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; }
    .question-year { font-family: var(--font-serif, serif); font-weight: 700; color: var(--color-primary, #1f3a5f); font-size: .95rem; }
    .question-number { color: var(--color-ink, #23322b); font-weight: 700; }
    .question-type-tag { font-size: .72rem; color: var(--color-ink-soft, #5c6b5f); background: var(--color-bg-alt, #eef0e8); padding: 3px 10px; border-radius: 999px; }
    .question-full { font-size: 1rem; color: var(--color-ink, #23322b); line-height: 1.85; }
    .question-links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
    .question-links a { font-size: .82rem; color: var(--color-primary, #1f3a5f); background: var(--color-primary-soft, #e7edf3); padding: 5px 12px; border-radius: 999px; }
    .question-links a:hover { opacity: .85; }
    .no-article { font-size: .82rem; color: var(--color-ink-faint, #8b988e); }
    .status-text { padding: 20px 0; color: var(--color-ink-soft, #5c6b5f); }
    .error-box { margin-top: 16px; padding: 14px 16px; border-left: 4px solid #a33; border-radius: 4px; color: #712; background: #fff3f3; line-height: 1.65; }
    @media (max-width: 720px) { .questions-page { padding-top: calc(var(--header-height, 72px) + 30px); padding-left: 30px; padding-right: 30px; } .q-filter { flex-direction: column; align-items: flex-start; } }
  </style>
</head>
<body>
  <header class="site-header"><div class="container nav-inner">
    <a href="index.html" class="logo"><span class="logo-mark">文</span><span class="logo-sub">DSE 中文科</span></a>
    <button class="nav-toggle" id="navToggle" type="button" aria-label="開啟選單" aria-expanded="false" aria-controls="mainNav"><span></span><span></span><span></span></button>
    <div class="main-nav" id="mainNav"><nav class="nav-links" aria-label="主要導覽"><a href="genre-list.html">範文分類</a><a href="questions.html" aria-current="page">歷屆試題</a><a href="techniques.html">寫作手法</a><a href="notes.html">我的筆記</a></nav><form class="nav-search" role="search" action="search.html" method="get"><input type="search" name="q" placeholder="搜尋關鍵字" aria-label="搜尋"></form></div>
  </div></header>
  <main class="questions-page"><div class="container">
    <div class="questions-head"><h1>歷屆試題</h1><p>收錄 2012 至 2026 年 DSE 中文科寫作卷歷屆試題（含 Pilot Paper），可依年份或題型篩選，並直接連結到對應的範文拆解。</p></div>
    <div class="q-filter"><div class="q-filter-group"><label for="yearFilter">年份：</label><select id="yearFilter"><option value="">全部年份</option></select></div><div class="q-filter-group"><label for="typeFilter">題型：</label><select id="typeFilter"><option value="">全部題型</option></select></div></div>
    <p class="question-count-note" id="countNote" hidden></p><div class="question-list" id="questionList"><p class="status-text" id="questionStatus">試題載入中…</p></div><div id="errorBox"></div>
  </div></main>
  <footer class="site-footer"><div class="container footer-inner"><p>DSE 中文科範文自學平台</p></div></footer>
  <script>
    const navToggle=document.getElementById('navToggle'),mainNav=document.getElementById('mainNav');if(navToggle&&mainNav)navToggle.addEventListener('click',()=>{const open=navToggle.getAttribute('aria-expanded')==='true';navToggle.setAttribute('aria-expanded',String(!open));mainNav.classList.toggle('is-open',!open)});
    const listEl=document.getElementById('questionList'),countNoteEl=document.getElementById('countNote'),errorBoxEl=document.getElementById('errorBox'),yearFilterEl=document.getElementById('yearFilter'),typeFilterEl=document.getElementById('typeFilter');let allQuestions=[];
    const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
    const labels={narrative:'記敘抒情文',argumentative:'論說文',descriptive:'描寫文',topic:'話題式／開放式',practical:'實用寫作'};
    function yearValue(year){const match=String(year??'').match(/(\d{4})/);return match?Number(match[1]):-Infinity}
    function questionValue(number){const match=String(number??'').match(/(\d+)/);return match?Number(match[1]):999}
    function sortQuestions(a,b){return yearValue(b.year)-yearValue(a.year)||questionValue(a.questionNumber)-questionValue(b.questionNumber)}
    function relatedArticleIds(q){return [...new Set(allArticles.filter(a=>(a.relatedQuestions||[]).some(r=>String(r.year)===String(q.year)&&String(r.questionNumber)===String(q.questionNumber))).map(a=>a.id))]}
    let allArticles=[];
    function buildCard(q){const ids=relatedArticleIds(q);const links=ids.length?ids.map(id=>`<a href="article.html?id=${encodeURIComponent(id)}">查看篇章 ${String(id).padStart(2,'0')}</a>`).join(''):'<span class="no-article">暫未有對應範文</span>';return `<article class="question-card"><div class="question-card-head"><span class="question-year">${esc(q.year)}年</span><span class="question-number">${esc(q.questionNumber)}</span><span class="question-type-tag">${esc(labels[q.genre]||q.questionType||'題目')}</span></div><p class="question-full">${esc(q.questionFull||q.question||'題目內容待補')}</p><div class="question-links">${links}</div></article>`}
    function parseType(q){return q.genre||q.questionType||''}
    function populateFilters(){const years=[...new Set(allQuestions.map(q=>q.year))].sort((a,b)=>yearValue(b)-yearValue(a));const types=[...new Set(allQuestions.map(parseType).filter(Boolean))];yearFilterEl.innerHTML='<option value="">全部年份</option>'+years.map(y=>`<option value="${esc(y)}">${esc(y)}</option>`).join('');typeFilterEl.innerHTML='<option value="">全部題型</option>'+types.map(t=>`<option value="${esc(t)}">${esc(labels[t]||t)}</option>`).join('')}
    function render(){const year=yearFilterEl.value,type=typeFilterEl.value;const filtered=allQuestions.filter(q=>(!year||String(q.year)===year)&&(!type||parseType(q)===type)).sort(sortQuestions);countNoteEl.hidden=false;countNoteEl.textContent=`共 ${filtered.length} 題`;listEl.innerHTML=filtered.length?filtered.map(buildCard).join(''):'<p class="status-text">沒有符合條件的試題。</p>'}
    async function load(){try{const [qr,ar]=await Promise.all([fetch('data/questions.json',{cache:'no-store'}),fetch('data/articles.json',{cache:'no-store'})]);if(!qr.ok)throw Error(`data/questions.json HTTP ${qr.status}`);if(!ar.ok)throw Error(`data/articles.json HTTP ${ar.status}`);allQuestions=await qr.json();allArticles=await ar.json();if(!Array.isArray(allQuestions))throw Error('data/questions.json 格式必須是陣列');populateFilters();render()}catch(e){countNoteEl.hidden=true;listEl.innerHTML='<p class="status-text">試題載入失敗。</p>';errorBoxEl.innerHTML=`<div class="error-box"><strong>資料載入失敗</strong><br>${esc(e.message)}<br>請確認資料檔案已上傳，而且網站是透過伺服器開啟。</div>`;console.error(e)}}
    yearFilterEl.addEventListener('change',render);typeFilterEl.addEventListener('change',render);load();
  </script>
</body>
</html>
