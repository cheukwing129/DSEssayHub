<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>歷屆試題｜DSE 中文科範文</title>
  <meta name="description" content="按年份及題型瀏覽 DSE 中文科寫作卷歷屆試題與對應範文。">
  <link rel="stylesheet" href="style.css">
  <style>
    .questions-page { padding: calc(var(--header-height, 72px) + 48px) 0 64px; }
    .questions-head { max-width: 760px; margin-bottom: 28px; }
    .questions-head h1 { font-size: 2rem; margin-bottom: 10px; }
    .questions-head p { color: var(--color-ink-soft, #5c6b5f); line-height: 1.8; }
    .q-filter { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; margin-bottom: 24px; padding: 15px 18px; background: var(--color-bg-alt, #eef0e8); border: 1px solid var(--color-border, #ddd6c4); border-radius: 14px; }
    .q-filter-group { display: flex; align-items: center; gap: 8px; }
    .q-filter label { font-size: .88rem; color: var(--color-ink-soft, #5c6b5f); }
    .q-filter select { min-height: 44px; padding: 8px 14px; border: 1px solid var(--color-border, #ddd6c4); border-radius: 999px; background: #fff; font: inherit; font-size: .88rem; color: var(--color-ink, #23322b); }
    .q-filter-reset { min-height: 44px; border: 0; background: none; color: var(--color-primary, #1f3a5f); padding: 8px; font-size: .82rem; }
    .question-count-note { font-size: .82rem; color: var(--color-ink-faint, #8b988e); margin-bottom: 20px; }
    .question-list { display: flex; flex-direction: column; gap: 28px; }
    .question-year-group { min-width: 0; }
    .question-group-heading { display: flex; align-items: center; gap: 10px; margin: 0 0 12px; }
    .question-group-heading h2 { margin: 0; color: var(--color-ink, #23322b); font: 700 1.35rem/1.3 var(--font-serif, serif); letter-spacing: .02em; }
    .question-group-count { padding: 3px 9px; border-radius: 999px; background: var(--color-bg-alt, #eef0e8); color: var(--color-ink-soft, #5c6b5f); font-size: .7rem; white-space: nowrap; }
    .question-group-rule { height: 1px; flex: 1; background: var(--color-border-soft, #e7e2d3); }
    .question-source-tag { color: var(--color-ink-soft, #5c6b5f); font-size: .72rem; letter-spacing: .04em; white-space: nowrap; }
    .question-cards { display: flex; flex-direction: column; gap: 10px; }
    .question-card { display: grid; grid-template-columns: minmax(0, 1fr) minmax(158px, 190px); column-gap: 24px; row-gap: 9px; align-items: start; min-width: 0; background: var(--color-surface, #fff); border: 1px solid var(--color-border, #ddd6c4); border-radius: var(--radius-md, 10px); padding: 17px 18px; transition: border-color .15s ease, background-color .15s ease; }
    .question-card:hover { border-color: #c4cbbb; background: #fffefa; }
    .question-card-head { grid-column: 1; grid-row: 1; display: flex; flex-direction: row; align-items: center; flex-wrap: wrap; gap: 9px; min-width: 0; padding: 0 0 9px; border-right: 0; border-bottom: 1px solid var(--color-border-soft, #e7e2d3); }
    .question-number { color: var(--color-primary, #1f3a5f); font: 700 1.08rem/1.3 var(--font-serif, serif); letter-spacing: .02em; }
    .question-type-tag { max-width: 100%; font-size: .72rem; line-height: 1.4; color: var(--color-ink-soft, #5c6b5f); background: var(--color-bg-alt, #eef0e8); padding: 4px 9px; border-radius: 999px; }
    .question-card-main { grid-column: 1; grid-row: 2; min-width: 0; display: grid; gap: 8px; }
    .question-full { font-size: .96rem; color: var(--color-ink, #23322b); line-height: 1.85; }
    .question-image-note { margin: 0; font-size: .82rem; color: var(--color-ink-soft, #5c6b5f); }
    .question-image-wrap { margin: 2px 0 0; max-width: 720px; }
    .question-image { display: block; max-width: 100%; height: auto; border: 1px solid var(--color-border, #ddd6c4); border-radius: var(--radius-sm, 8px); background: #fff; }
    .question-image-wrap figcaption { margin-top: 7px; font-size: .78rem; color: var(--color-ink-faint, #8b988e); }
    .question-links-panel { grid-column: 2; grid-row: 1 / span 2; align-self: stretch; min-width: 0; padding-left: 16px; border-left: 1px solid var(--color-border-soft, #e7e2d3); }
    .question-links-label { display: block; margin: 2px 0 7px; color: var(--color-ink-soft, #5c6b5f); font-size: .72rem; }
    .question-links { display: flex; flex-wrap: wrap; gap: 6px; }
    .question-links a { display: inline-flex; align-items: center; justify-content: center; min-width: 44px; min-height: 44px; font-size: .78rem; font-weight: 600; color: var(--color-primary, #1f3a5f); background: var(--color-primary-soft, #e7edf3); padding: 6px 9px; border-radius: 7px; }
    .question-links a:hover { background: #dce5ed; }
    .no-article { font-size: .76rem; line-height: 1.65; color: var(--color-ink-faint, #8b988e); }
    .status-text { padding: 20px 0; color: var(--color-ink-soft, #5c6b5f); }
    
    @media (max-width: 720px) {
      .questions-page { padding-top: calc(var(--header-height, 72px) + 30px); }
      .q-filter { flex-direction: column; align-items: stretch; gap: 10px; padding: 14px; }
      .q-filter-group { width: 100%; justify-content: space-between; }
      .q-filter select { min-width: 0; flex: 1; }
      .q-filter-reset { align-self: flex-start; }
      .question-list { gap: 24px; }
      .question-card { grid-template-columns: minmax(0, 1fr); gap: 11px; padding: 15px 14px; }
      .question-card-head { grid-column: 1; grid-row: auto; min-height: 0; padding: 0 0 9px; border-right: 0; border-bottom: 1px solid var(--color-border-soft, #e7e2d3); }
      .question-card-main { grid-column: 1; grid-row: auto; }
      .question-links-panel { grid-column: 1; grid-row: auto; padding: 9px 0 0; border-left: 0; border-top: 1px solid var(--color-border-soft, #e7e2d3); }
    }

    @media (max-width: 520px) {
      .question-group-heading { gap: 8px; }
      .question-group-heading h2 { font-size: 1.18rem; }
      .question-source-tag { font-size: .62rem; }
      .question-card { padding: 14px; }
      .question-full { font-size: .92rem; }
      .question-links { gap: 7px; }
    }
  </style>
</head>
<body>
<a class="skip-link" href="#mainContent">跳至主要內容</a>
  <header class="site-header"><div class="container nav-inner">
    <a href="index.html" class="logo"><span class="logo-mark">範文自學</span><span class="logo-sub">DSE 中文寫作</span></a>
    <button class="nav-toggle" id="navToggle" type="button" aria-label="開啟選單" aria-expanded="false" aria-controls="mainNav"><span></span><span></span><span></span></button>
    <div class="main-nav" id="mainNav"><nav class="nav-links" aria-label="主導航"><a href="genre-list.html">文體分類</a><a href="questions.html" aria-current="page">歷屆試題</a><a href="techniques.html">寫作技巧</a><a href="notes.html">我的筆記</a></nav><form class="nav-search" role="search" action="search.html" method="get"><input type="search" name="q" placeholder="搜尋範文、題目或年份…" aria-label="搜尋範文"></form></div>
  </div></header>
  <main id="mainContent" tabindex="-1" class="questions-page"><div class="container">
    <div class="questions-head"><h1>歷屆試題</h1><p>收錄 2012 至 2026 年 DSE 中文科寫作題目，另收錄 2012 Pilot Paper 及文學題；可依來源／年份或題型篩選，並直接連結到對應的範文拆解。</p></div>
    <div class="q-filter"><div class="q-filter-group"><label for="yearFilter">來源／年份：</label><select id="yearFilter"><option value="">全部來源／年份</option></select></div><div class="q-filter-group"><label for="typeFilter">題型：</label><select id="typeFilter"><option value="">全部題型</option></select></div><div class="q-filter-group"><label for="coverageFilter">範文：</label><select id="coverageFilter"><option value="">全部</option><option value="with">有範文</option><option value="without">未有範文</option></select></div><button type="button" class="q-filter-reset" id="clearFilters" hidden>清除篩選</button></div>
    <p class="question-count-note" id="countNote" aria-live="polite" aria-atomic="true" hidden></p><div class="question-list" id="questionList"><p class="status-text" id="questionStatus">試題載入中…</p></div><div id="errorBox"></div>
  </div></main>
  <footer class="site-footer"><div class="container footer-inner"><p>DSE 中文科範文自學平台</p></div></footer>
  <script src="site.js"></script>
<script>
const listEl=document.getElementById('questionList');
const countNoteEl=document.getElementById('countNote');
const errorBoxEl=document.getElementById('errorBox');
const yearFilterEl=document.getElementById('yearFilter');
const typeFilterEl=document.getElementById('typeFilter');
const coverageFilterEl=document.getElementById('coverageFilter');
const clearFiltersEl=document.getElementById('clearFilters');
const pageParams=new URLSearchParams(location.search);
let allQuestions=[],allArticles=[];
const esc=DSEHub.escapeHtml;
const labels={narrative:'記敘抒情文',argumentative:'論說文',descriptive:'描寫文',topic:'話題式／開放式',practical:'實用寫作'};

function yearValue(year){
  const match=String(year??'').match(/(\d{4})/);
  return match?Number(match[1]):-Infinity;
}
function questionValue(number){
  const match=String(number??'').match(/(\d+)/);
  return match?Number(match[1]):999;
}
function sortQuestions(a,b){
  return yearValue(b.year)-yearValue(a.year)||questionValue(a.questionNumber)-questionValue(b.questionNumber);
}
function relatedArticleIds(q){
  return [...new Set(allArticles.filter(a=>(a.relatedQuestions||[]).some(r=>String(r.year)===String(q.year)&&String(r.questionNumber)===String(q.questionNumber))).map(a=>a.id))];
}
function parseType(q){
  return q.genre||q.questionType||'';
}
function listUrl({restore=false}={}){
  const params=new URLSearchParams();
  if(yearFilterEl.value) params.set('year',yearFilterEl.value);
  if(typeFilterEl.value) params.set('qtype',typeFilterEl.value);
  if(coverageFilterEl.value) params.set('coverage',coverageFilterEl.value);
  if(restore) params.set('restore','1');
  const query=params.toString();
  return query?`questions.html?${query}`:'questions.html';
}
function syncUrl(){
  history.replaceState(null,'',listUrl());
}
function scrollStateKey(){
  return `dse-questions-scroll:${yearFilterEl.value||'all'}:${typeFilterEl.value||'all'}:${coverageFilterEl.value||'all'}`;
}
function saveScrollPosition(){
  try{sessionStorage.setItem(scrollStateKey(),String(Math.max(0,Math.round(scrollY))))}catch{}
}
function restoreScrollIfNeeded(){
  const navigationType=performance.getEntriesByType?.('navigation')?.[0]?.type;
  const shouldRestore=pageParams.get('restore')==='1'||navigationType==='back_forward';
  if(!shouldRestore)return;
  let saved=0;
  try{saved=Number(sessionStorage.getItem(scrollStateKey())||0)}catch{}
  requestAnimationFrame(()=>requestAnimationFrame(()=>scrollTo({top:Number.isFinite(saved)?saved:0,behavior:'auto'})));
  if(pageParams.has('restore')) history.replaceState(null,'',listUrl());
}
function articleHref(id){
  return `article.html?id=${encodeURIComponent(id)}&returnTo=${encodeURIComponent(listUrl())}`;
}
function questionSourceKind(year){
  const value=String(year??'');
  if(value==='2012pp')return 'Pilot Paper';
  if(value.startsWith('文學'))return '文學題';
  return 'DSE';
}
function buildCard(q){
  const ids=relatedArticleIds(q);
  const links=ids.length?`<div class="question-links-label">對應範文 · ${ids.length} 篇</div><div class="question-links">${ids.map(id=>`<a href="${articleHref(id)}" aria-label="查看篇章 ${String(id).padStart(2,'0')}">篇章 ${String(id).padStart(2,'0')}</a>`).join('')}</div>`:`<div class="question-links-label">範文收錄</div><span class="no-article">暫未有對應範文</span>`;
  const imageBlock=q.hasImage&&q.imagePath?`<figure class="question-image-wrap"><img class="question-image" src="${esc(q.imagePath)}" alt="${esc(q.imageAlt||'原題附圖')}" loading="lazy" decoding="async"><figcaption>${esc(q.imageNote||'原題附圖')}</figcaption></figure>`:q.hasImage?`<p class="question-image-note">${esc(q.imageNote||'原題附圖；目前未收錄圖像。')}</p>`:'';
  return `<article class="question-card" aria-label="${esc(DSEHub.formatQuestionSourceYear(q.year))} ${esc(q.questionNumber)} ${esc(labels[q.genre]||q.questionType||'題目')}"><div class="question-card-head"><span class="question-number">${esc(q.questionNumber)}</span><span class="question-type-tag">${esc(labels[q.genre]||q.questionType||'題目')}</span></div><div class="question-card-main"><p class="question-full">${esc(q.questionFull||q.question||'題目內容待補')}</p>${imageBlock}</div><div class="question-links-panel">${links}</div></article>`;
}
function populateFilters(){
  const years=[...new Set(allQuestions.map(q=>q.year))].sort((a,b)=>yearValue(b)-yearValue(a));
  const types=[...new Set(allQuestions.map(parseType).filter(Boolean))];
  yearFilterEl.innerHTML='<option value="">全部來源／年份</option>'+years.map(y=>`<option value="${esc(y)}">${esc(DSEHub.formatQuestionSourceYear(y))}</option>`).join('');
  typeFilterEl.innerHTML='<option value="">全部題型</option>'+types.map(t=>`<option value="${esc(t)}">${esc(labels[t]||t)}</option>`).join('');
  const requestedYear=pageParams.get('year')||'';
  const requestedType=pageParams.get('qtype')||'';
  const requestedCoverage=pageParams.get('coverage')||'';
  yearFilterEl.value=years.some(y=>String(y)===requestedYear)?requestedYear:'';
  typeFilterEl.value=types.includes(requestedType)?requestedType:'';
  coverageFilterEl.value=['with','without'].includes(requestedCoverage)?requestedCoverage:'';
}
function render(){
  const year=yearFilterEl.value;
  const type=typeFilterEl.value;
  const coverage=coverageFilterEl.value;
  const hasFilters=Boolean(year||type||coverage);
  const filtered=allQuestions.filter(q=>{
    const ids=relatedArticleIds(q);
    const coverageMatches=!coverage||(coverage==='with'?ids.length>0:ids.length===0);
    return(!year||String(q.year)===year)&&(!type||parseType(q)===type)&&coverageMatches;
  }).sort(sortQuestions);
  const activeFilters=[];
  if(year) activeFilters.push(`來源／年份：${yearFilterEl.selectedOptions[0]?.textContent||year}`);
  if(type) activeFilters.push(`題型：${typeFilterEl.selectedOptions[0]?.textContent||labels[type]||type}`);
  if(coverage) activeFilters.push(`範文：${coverageFilterEl.selectedOptions[0]?.textContent||coverage}`);
  countNoteEl.hidden=false;
  countNoteEl.textContent=hasFilters?`顯示 ${filtered.length}／${allQuestions.length} 題；目前條件：${activeFilters.join('、')}`:`共 ${allQuestions.length} 題`;
  clearFiltersEl.hidden=!hasFilters;
  if(!filtered.length){
    listEl.innerHTML='<p class="status-text">沒有符合目前篩選條件的試題。</p>';
    return;
  }
  const groups=new Map();
  filtered.forEach(q=>{
    const source=String(q.year??'');
    if(!groups.has(source))groups.set(source,[]);
    groups.get(source).push(q);
  });
  listEl.innerHTML=[...groups.entries()].map(([source,questions],index)=>`<section class="question-year-group" aria-labelledby="question-year-${index}"><div class="question-group-heading"><h2 id="question-year-${index}">${esc(DSEHub.formatQuestionSourceYear(source))}</h2><span class="question-group-count">${questions.length} 題</span><span class="question-group-rule" aria-hidden="true"></span><span class="question-source-tag">${esc(questionSourceKind(source))}</span></div><div class="question-cards">${questions.map(buildCard).join('')}</div></section>`).join('');
}
async function load(){
  try{
    const [qr,ar]=await Promise.all([
      fetch('data/questions.json',{cache:'no-store'}),
      fetch('data/articles.json',{cache:'no-store'})
    ]);
    if(!qr.ok)throw Error(`data/questions.json HTTP ${qr.status}`);
    if(!ar.ok)throw Error(`data/articles.json HTTP ${ar.status}`);
    allQuestions=await qr.json();
    allArticles=await ar.json();
    if(!Array.isArray(allQuestions))throw Error('data/questions.json 格式必須是陣列');
    if(!Array.isArray(allArticles))throw Error('data/articles.json 格式必須是陣列');
    populateFilters();
    render();
    restoreScrollIfNeeded();
  }catch(e){
    countNoteEl.hidden=true;
    listEl.innerHTML='<p class="status-text">試題載入失敗。</p>';
    errorBoxEl.innerHTML=`<div class="error-box"><strong>資料載入失敗</strong><br>${esc(e.message)}<br>請確認資料檔案已上傳，而且網站是透過伺服器開啟。</div>`;
    console.error(e);
  }
}
function applyFilters(){
  syncUrl();
  render();
}
yearFilterEl.addEventListener('change',applyFilters);
typeFilterEl.addEventListener('change',applyFilters);
coverageFilterEl.addEventListener('change',applyFilters);
clearFiltersEl.addEventListener('click',()=>{
  yearFilterEl.value='';
  typeFilterEl.value='';
  coverageFilterEl.value='';
  syncUrl();
  render();
  yearFilterEl.focus();
});
listEl.addEventListener('click',event=>{
  if(event.target.closest('.question-links a')) saveScrollPosition();
});
addEventListener('pagehide',saveScrollPosition);
load();
</script>
</body>
</html>
